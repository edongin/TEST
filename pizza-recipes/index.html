<title>루이지 피자 노트</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 레시피 카드 그리드 → 상세(재료 위 / 레시피 아래), 어두운 피자스톤 위에 그린 피자 일러스트 */
:root{
  --bg:#F1F2EF; --surface:#FFFFFF; --sunken:#E7E8E3;
  --ink:#1E1C1A; --muted:#67635D; --line:#D9D9D3;
  --accent:#BE3520; --accent-ink:#FFFFFF; --basil:#2E6A44; --heat:#C9661A;
  --stone:#2B2826; --stone-2:#36322F;
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151413; --surface:#1F1D1B; --sunken:#282624;
  --ink:#EDEAE5; --muted:#A39E96; --line:#353230;
  --accent:#E4573C; --accent-ink:#1A0F0C; --basil:#74B58A; --heat:#EE9A4A;
  --stone:#0E0D0C; --stone-2:#1A1817; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#151413; --surface:#1F1D1B; --sunken:#282624;
  --ink:#EDEAE5; --muted:#A39E96; --line:#353230;
  --accent:#E4573C; --accent-ink:#1A0F0C; --basil:#74B58A; --heat:#EE9A4A;
  --stone:#0E0D0C; --stone-2:#1A1817; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 96px}
h1,h2,h3{text-wrap:balance;margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none}
.brand b{font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.nav{display:flex;gap:6px}
.nav a{text-decoration:none;font-size:14px;padding:6px 12px;border-radius:999px;color:var(--muted)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}

/* home intro */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:28px}
.intro h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,48px);line-height:1.15}
.intro h1 em{font-style:normal;color:var(--accent)}
.intro p{color:var(--muted);margin:12px 0 0;max-width:58ch}
.spec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.spec div{padding:12px 14px;border-top:1px solid var(--line)}
.spec div:nth-child(-n+2){border-top:0}
.spec div:nth-child(even){border-left:1px solid var(--line)}
.spec dt{font-size:12px;color:var(--muted)}
.spec dd{margin:0;font-family:var(--f-mono);font-size:18px;font-weight:500}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px -14px rgba(0,0,0,.35)}
.plate{background:radial-gradient(circle at 50% 45%,var(--stone-2),var(--stone) 70%);aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;position:relative}
.plate svg{width:78%;height:auto;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));transition:transform .5s ease}
.card:hover .plate svg{transform:rotate(14deg)}
.plate .badge{position:absolute;left:12px;top:12px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.92);color:#1E1C1A}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:19px;font-weight:700;line-height:1.3}
.card h3 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.6;flex:1}
.times{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.times div+div{border-left:1px solid var(--line);padding-left:12px}
.times dt{font-size:12px;color:var(--muted)}
.times dd{margin:0;font-family:var(--f-mono);font-weight:500;font-size:15px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:1px 8px;border-radius:4px;background:var(--sunken);color:var(--muted)}
.guide-link{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:28px;padding:18px 20px;border:1px dashed var(--line);border-radius:14px;text-decoration:none}
.guide-link b{font-size:16px}
.guide-link span{color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:8px;padding:9px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.note{font-size:13px;color:var(--muted)}

/* detail */
.back{display:inline-flex;gap:6px;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:16px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:center;margin-bottom:36px}
.hero .plate{border-radius:16px;aspect-ratio:1/1}
.hero .plate svg{width:82%}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4.6vw,46px);line-height:1.15}
.hero .orig{color:var(--muted);font-size:14px;margin-top:4px}
.hero .lead{margin:14px 0 18px;max-width:58ch}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.facts div{padding:10px 12px;min-width:0}
.facts div+div{border-left:1px solid var(--line)}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--f-mono);font-weight:500;font-size:16px;line-height:1.35}
.facts dd small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:400}
section.block{margin-top:40px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.sec-head h2{font-family:var(--f-display);font-weight:400;font-size:26px}
.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.stepper button{width:36px;height:36px;border:0;background:none;cursor:pointer;font-size:18px}
.stepper output{min-width:54px;text-align:center;font-family:var(--f-mono);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 12px;font-size:13px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ctrl-label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.ing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.ing-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.ing-group h3{font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.ing-group h3 span{font-weight:400;color:var(--muted);font-size:12px}
.ing{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.ing:first-of-type{border-top:0}
.ing input{margin:4px 0 0;accent-color:var(--basil);width:16px;height:16px}
.ing .nm{font-weight:500}
.ing .nt{display:block;font-size:12.5px;color:var(--muted);font-weight:400;line-height:1.5}
.ing .qt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;text-align:right;white-space:nowrap}
.ing.done .nm,.ing.done .qt{text-decoration:line-through;color:var(--muted)}
.oven{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--stone);color:#F2EEE8;border-radius:14px;overflow:hidden}
.oven div{padding:16px 18px;min-width:0}
.oven div+div{border-left:1px solid rgba(255,255,255,.1)}
.oven dt{font-size:12px;color:#B5AEA5}
.oven dd{margin:2px 0 0;font-family:var(--f-mono);font-size:20px;font-weight:500;color:#FFB36B;line-height:1.3}
.oven dd small{display:block;font-family:var(--f-body);font-size:12px;color:#D6CFC6;font-weight:400;margin-top:4px}
.oven-why{margin:10px 2px 0}
.phase{margin-top:26px}
.phase:first-child{margin-top:0}
.phase h3{font-size:16px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.phase h3 .pl{font-family:var(--f-mono);font-size:12px;font-weight:500;background:var(--ink);color:var(--bg);border-radius:4px;padding:1px 7px}
.phase h3 .sub{font-weight:400;font-size:13px;color:var(--muted)}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.step .n{font-family:var(--f-mono);font-size:18px;font-weight:500;color:var(--accent)}
.step h4{margin:0;font-size:15.5px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.step h4 .dur{font-family:var(--f-mono);font-size:12px;font-weight:400;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.step p{margin:4px 0 0;max-width:68ch}
.tbtn{margin-top:8px;border:1px solid var(--heat);color:var(--heat);background:transparent;border-radius:999px;padding:3px 12px;font-family:var(--f-mono);font-size:13px;cursor:pointer}
.tbtn:hover{background:var(--heat);color:var(--surface)}
.plan{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:24px;align-items:start}
.plan label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
.plan input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 14px 18px}
.tl li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.tl li.hot::before{border-color:var(--heat);background:var(--heat)}
.tl li.eat::before{border-color:var(--accent);background:var(--accent)}
.tl .when{font-family:var(--f-mono);font-weight:500;font-size:14px}
.tl .what{display:block;color:var(--muted);font-size:14px}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.tipbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.tipbox h3{font-size:15px;margin-bottom:8px}
.tipbox ul{margin:0;padding-left:18px}
.tipbox li+li{margin-top:6px}

/* guide */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-size:12px;color:var(--muted);font-weight:600;background:var(--sunken)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
details+details{margin-top:8px}
summary{cursor:pointer;font-weight:600}
details p{margin:8px 0 0;max-width:70ch}

/* timer */
.timer{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--stone);color:#F2EEE8;border-radius:14px;padding:12px 14px 12px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 40px -12px rgba(0,0,0,.6);z-index:20;max-width:calc(100% - 32px)}
.timer .tl-name{font-size:12px;color:#B5AEA5;display:block}
.timer .tl-time{font-family:var(--f-mono);font-size:26px;font-weight:500;color:#FFB36B;line-height:1.1}
.timer.ring .tl-time{color:#FF6B4F;animation:blink 1s steps(2) infinite}
.timer button{background:rgba(255,255,255,.12);border:0;color:#F2EEE8;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px}
@keyframes blink{50%{opacity:.35}}

@media (max-width:760px){
  .intro,.hero,.plan{grid-template-columns:minmax(0,1fr)}
  .hero .plate{max-width:420px}
  .facts,.oven{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facts div:nth-child(3),.oven div:nth-child(3){border-left:0}
  .facts div:nth-child(n+3){border-top:1px solid var(--line)}
  .oven div:nth-child(n+3){border-top:1px solid rgba(255,255,255,.1)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#"><b>루이지 피자 노트</b><span>Unold Luigi 68816 기준</span></a>
    <nav class="nav" aria-label="메뉴">
      <a href="#" id="nav-home">레시피</a>
      <a href="#guide" id="nav-guide">도우 · 오븐 가이드</a>
    </nav>
  </header>
  <main id="app"></main>
</div>

<div class="timer" id="timer" hidden role="status" aria-live="polite">
  <div><span class="tl-name" id="timer-name">타이머</span><span class="tl-time" id="timer-time">0:00</span></div>
  <button type="button" id="timer-pause">일시정지</button>
  <button type="button" id="timer-close">닫기</button>
</div>

<script>
/* ---------- 도우 ---------- */
const DOUGHS = {
  napoli:{
    name:'나폴리 도우', sub:'24시간 냉장 저온숙성', ball:208,
    ing:[
      {n:'00 밀가루 (피자용)', q:125, u:'g', note:'없으면 강력분. 이때 물은 75g으로 줄이기'},
      {n:'찬물', q:80, u:'g', note:'수분율 64%'},
      {n:'고운 소금', q:3.5, u:'g'},
      {n:'인스턴트 드라이이스트', q:0.25, u:'g', note:'4판 분량에 1g. 0.1g 저울이 없으면 1/4작은술이 약 0.8g'}
    ],
    stages:[
      {m:30, t:'반죽하기'},
      {m:60, t:'실온 1차 발효 후 분할'},
      {m:1440, t:'냉장 저온숙성'},
      {m:150, t:'실온 복귀'}
    ],
    steps:[
      {h:'섞기', d:10, p:'찬물에 소금을 먼저 녹이고 밀가루 2/3와 이스트를 넣어 주걱으로 섞습니다. 나머지 밀가루를 넣고 가루가 안 보일 때까지 뭉친 뒤 랩을 씌워 10분 둡니다.'},
      {h:'치대기', d:10, p:'손바닥으로 밀었다 접기를 8~10분. 표면이 매끈하고 살짝 끈적이는 상태가 되면 됩니다. 반죽기는 저속 6분.'},
      {h:'실온 1차 발효', d:60, p:'볼에 덮개를 씌워 실온(20~24°C)에서 1시간.'},
      {h:'분할 · 둥글리기', d:10, p:'한 덩이 약 208g으로 나눠 표면이 팽팽해지게 둥글립니다. 올리브오일을 살짝 바른 밀폐용기에 하나씩 담습니다.'},
      {h:'냉장 저온숙성', d:1440, p:'냉장고에서 24시간(최대 48시간). 천천히 발효하면서 맛이 깊어지고 늘리기 쉬워집니다.'},
      {h:'실온 복귀', d:150, p:'굽기 2시간 30분 전에 꺼내 뚜껑을 덮은 채 둡니다. 손가락으로 눌렀을 때 자국이 천천히 돌아오면 준비 완료. 이 시간 끝 무렵에 루이지 예열을 시작하세요.'}
    ]
  },
  sameday:{
    name:'당일 도우', sub:'6시간 30분, 실온 발효', ball:210,
    ing:[
      {n:'00 밀가루 또는 강력분', q:125, u:'g', note:'강력분이면 물 77g'},
      {n:'미지근한 물 (25~28°C)', q:81, u:'g', note:'수분율 65%'},
      {n:'고운 소금', q:3.5, u:'g'},
      {n:'인스턴트 드라이이스트', q:0.75, u:'g', note:'4판 분량에 3g (약 1작은술)'}
    ],
    stages:[
      {m:30, t:'반죽하기'},
      {m:120, t:'실온 1차 발효'},
      {m:240, t:'분할 후 2차 발효'}
    ],
    steps:[
      {h:'섞고 치대기', d:30, p:'물에 소금을 녹이고 밀가루와 이스트를 넣어 뭉칩니다. 10분 쉬었다가 8~10분 치대 매끈하게 만듭니다.'},
      {h:'실온 1차 발효', d:120, p:'덮어서 실온 2시간. 부피가 1.5배 정도 되면 됩니다.'},
      {h:'분할 · 2차 발효', d:240, p:'약 210g씩 나눠 둥글리고 오일 바른 용기에 담아 실온 4시간. 거의 2배로 부풀고 표면에 작은 기포가 보이면 준비 완료. 마지막 30분에 예열을 시작하세요.'}
    ]
  },
  ny:{
    name:'뉴욕 도우', sub:'설탕·오일 넣은 24시간 숙성', ball:214,
    ing:[
      {n:'강력분', q:125, u:'g'},
      {n:'찬물', q:79, u:'g', note:'수분율 63%'},

const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtDur(m){
  if(m<60) return `${Math.round(m)}분`;
  const h=Math.floor(m/60), r=Math.round(m%60);
  return r? `${h}시간 ${r}분` : `${h}시간`;
}
function prepMin(r, doughId){
  const d=DOUGHS[doughId||r.dough];
  return d.stages.reduce((a,s)=>a+s.m,0);
}
function fracStr(v){
  const w=Math.floor(v), f=Math.round((v-w)*4)/4;
  const m={0:'',0.25:'¼',0.5:'½',0.75:'¾'};
  if(f===1) return String(w+1);
  return (w? String(w):'') + (m[f]||'') || '0';
}
function fmtQty(q,u,n){
  if(q==null) return '';
  const v=q*n;
  if(u==='g'){
    if(v<1) return `${(Math.round(v*100)/100).toString()}g`;
    if(v<10) return `${(Math.round(v*10)/10).toString()}g`;
    return `${Math.round(v)}g`;
  }
  if(u==='큰술'||u==='작은술') return `${fracStr(Math.round(v*4)/4)} ${u}`;
  return `${fracStr(Math.round(v*2)/2)}${u}`;
}

/* ---------- 피자 그림 (SVG 생성) ---------- */
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
let uid=0;
function pizzaSVG(r){
  const R=rng(hash(r.id)), id='p'+(uid++);
  const pt=(rr)=>{const a=R()*Math.PI*2, d=rr*Math.sqrt(R());return[Math.cos(a)*d,Math.sin(a)*d]};
  const f=n=>n.toFixed(2);

  <radialGradient id="${id}s"><stop offset="0.6" stop-color="#C23A20"/><stop offset="1" stop-color="#9E2A16"/></radialGradient></defs>`;
  s+=`<circle r="47" fill="url(#${id}c)"/>`;
  for(let i=0;i<46;i++){const a=R()*Math.PI*2,d=40.5+R()*6;s+=`<circle cx="${f(Math.cos(a)*d)}" cy="${f(Math.sin(a)*d)}" r="${f(0.6+R()*2.2)}" fill="#2C170A" opacity="${f(0.35+R()*0.5)}"/>`}
  const d=r.draw;
  if(d.base==='red'){
    s+=`<circle r="37" fill="url(#${id}s)"/>`;
    for(let i=0;i<14;i++){const a=i/14*Math.PI*2+R()*.3;s+=`<circle cx="${f(Math.cos(a)*35)}" cy="${f(Math.sin(a)*35)}" r="${f(2.5+R()*2)}" fill="#B9341C"/>`}
  } else {
    s+=`<circle r="37.5" fill="#EBD3A0"/><circle r="36" fill="#F1DDB0" opacity=".8"/>`;
  }
  const melt=(n,rr,rmin,rmax,fill,brown)=>{for(let i=0;i<n;i++){const[x,y]=pt(rr);const rad=rmin+R()*(rmax-rmin);s+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(rad)}" fill="${fill}"/>`;if(brown&&R()<.6)s+=`<circle cx="${f(x+rad*.3)}" cy="${f(y-rad*.2)}" r="${f(rad*.35)}" fill="#E3B872" opacity=".8"/>`}};
  if(d.cheese==='fresh') melt(8,27,5,8,'#FBF7EE',true);
  if(d.cheese==='light') melt(5,26,5,7,'#FBF7EE',true);
  if(d.cheese==='shred'){s+=`<circle r="35" fill="#F4DB97" opacity=".95"/>`;for(let i=0;i<55;i++){const[x,y]=pt(33);s+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(.8+R()*2.4)}" fill="${R()<.5?'#E6B45A':'#FAEBC0'}"/>`}}
  if(d.cheese==='lightshred'){for(let i=0;i<40;i++){const[x,y]=pt(33);s+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(1.5+R()*3)}" fill="${R()<.4?'#EFC876':'#FAEFCB'}"/>`}}
  if(d.cheese==='four'){s+=`<circle r="35" fill="#F6E2A8"/>`;melt(9,30,3,6,'#FCF8EE',true);for(let i=0;i<14;i++){const[x,y]=pt(31);s+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(1.6+R()*2.4)}" fill="#E9E4D4"/><circle cx="${f(x)}" cy="${f(y)}" r="${f(.6+R()*.9)}" fill="#7D9297"/>`}for(let i=0;i<30;i++){const[x,y]=pt(33);s+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(.5+R()*1.2)}" fill="#D9A24B" opacity=".7"/>`}}
  if(d.cheese==='burrata'){melt(4,26,4,6,'#FBF7EE',true)}
  const tops={
    basil(n){for(let i=0;i<n;i++){const[x,y]=pt(28),a=R()*180;s+=`<g transform="translate(${f(x)} ${f(y)}) rotate(${f(a)})"><ellipse rx="4.6" ry="2.5" fill="#2F7A3B"/><path d="M-4 0H4" stroke="#56A35F" stroke-width=".45"/></g>`}},
    oil(){for(let i=0;i<6;i++){const[x,y]=pt(30);s+=`<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(2+R()*2)}" ry="${f(.8+R())}" fill="#F7E07A" opacity=".45"/>`}},
    garlic(n){for(let i=0;i<n;i++){const[x,y]=pt(32);s+=`<ellipse cx="${f(x)}" cy="${f(y)}" rx="1.8" ry="1" transform="rotate(${f(R()*180)} ${f(x)} ${f(y)})" fill="#F6E9C8" stroke="#C9963F" stroke-width=".35"/>`}},
    oregano(){for(let i=0;i<70;i++){const[x,y]=pt(34);s+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(.25+R()*.3)}" fill="#3F5224"/>`}},
    pepperoni(n){const placed=[];let tries=0;while(placed.length<n&&tries<400){tries++;const[x,y]=pt(30);if(placed.some(p=>Math.hypot(p[0]-x,p[1]-y)<8.6))continue;placed.push([x,y]);s+=`<circle cx="${f(x)}" cy="${f(y)}" r="4.4" fill="#8F2214"/><circle cx="${f(x)}" cy="${f(y)}" r="3.4" fill="#BB3B25"/><circle cx="${f(x-.8)}" cy="${f(y-.8)}" r="1.2" fill="#D35B3E" opacity=".7"/>`}},
    walnut(n){for(let i=0;i<n;i++){const[x,y]=pt(28);s+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(1.4+R())}" fill="#8A5A30"/><circle cx="${f(x+.5)}" cy="${f(y-.4)}" r=".7" fill="#B07A45"/>`}},
    honey(){for(let k=0;k<3;k++){let x=-28+R()*8,y=-20+k*16+R()*4;let p=`M${f(x)} ${f(y)}`;for(let j=0;j<5;j++){const nx=x+11,ny=y+(R()*10-5);p+=` Q${f(x+5.5)} ${f(ny+(R()*8-4))} ${f(nx)} ${f(ny)}`;x=nx;y=ny}s+=`<path d="${p}" fill="none" stroke="#E3A532" stroke-width="1.1" stroke-linecap="round" opacity=".85"/>`}},

    pepper(){for(let i=0;i<40;i++){const[x,y]=pt(34);s+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(.2+R()*.25)}" fill="#1E1A17"/>`}},
    parsley(){for(let i=0;i<50;i++){const[x,y]=pt(32);s+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(.35+R()*.4)}" fill="#3F7F2E"/>`}},
    mushroom(n){for(let i=0;i<n;i++){const[x,y]=pt(29);s+=`<g transform="translate(${f(x)} ${f(y)}) rotate(${f(R()*360)}) scale(1.25)"><path d="M-3.4 0A3.4 3.2 0 0 1 3.4 0Z" fill="#A9845E" stroke="#6E5032" stroke-width=".4"/><path d="M-1 0h2v2.6h-2Z" fill="#D9C2A0" stroke="#6E5032" stroke-width=".35"/></g>`}},
    prosciutto(n){for(let i=0;i<n;i++){const[x,y]=pt(24),a=R()*180;s+=`<g transform="translate(${f(x)} ${f(y)}) rotate(${f(a)})"><ellipse rx="8" ry="3.4" fill="#D47F7A"/><ellipse cy="1.6" rx="6.5" ry=".8" fill="#F3CFC6"/><ellipse cx="-2" cy="-1" rx="3" ry="1.1" fill="#C26A66"/></g>`}},
    arugula(n){for(let i=0;i<n;i++){const[x,y]=pt(18);s+=`<ellipse cx="${f(x)}" cy="${f(y)}" rx="3.8" ry="1.5" transform="rotate(${f(R()*180)} ${f(x)} ${f(y)})" fill="${R()<.5?'#3B7A30':'#5A9640'}"/>`}},
    parmesan(n){for(let i=0;i<n;i++){const[x,y]=pt(20);s+=`<rect x="${f(x-1.8)}" y="${f(y-.7)}" width="3.6" height="1.4" rx=".3" transform="rotate(${f(R()*180)} ${f(x)} ${f(y)})" fill="#F6E8BE"/>`}},
    cherry(n){const placed=[];let t=0;while(placed.length<n&&t<400){t++;const[x,y]=pt(31);if(Math.hypot(x,y)<14||placed.some(p=>Math.hypot(p[0]-x,p[1]-y)<8))continue;placed.push([x,y]);s+=`<circle cx="${f(x)}" cy="${f(y)}" r="3.8" fill="#CF331C"/><circle cx="${f(x)}" cy="${f(y)}" r="2.8" fill="#E86A4B"/><circle cx="${f(x-1)}" cy="${f(y)}" r=".45" fill="#F6CF86"/><circle cx="${f(x+1)}" cy="${f(y+.4)}" r=".45" fill="#F6CF86"/><circle cx="${f(x)}" cy="${f(y-1.1)}" r=".45" fill="#F6CF86"/>`}}
  };
  for(const [k,n] of d.top){ if(k!=='basil'||d.cheese!=='burrata') tops[k](n) }
  if(d.cheese==='burrata'){
    for(let i=0;i<9;i++){const a=i/9*Math.PI*2;s+=`<circle cx="${f(Math.cos(a)*9)}" cy="${f(Math.sin(a)*9)}" r="${f(4+R()*2)}" fill="#FCFAF4"/>`}
    s+=`<circle r="10" fill="#FCFAF4"/><path d="M-6 1C-3-4 4-3 7 1C4 5-3 6-6 1Z" fill="#F1E6CC"/>`;
    tops.basil(5);
  }
  return s+'</svg>';
}

function fmtSec(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function toLocalInput(d){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function defaultEat(r,st){
  const need=prepMin(r,st.dough)+25+r.cook;
  const d=new Date(Date.now()+need*60000);
  if(d.getHours()<18 || need>600){ // 숙성이 긴 도우는 다음 가능한 저녁 7시
    const e=new Date(d); e.setHours(19,0,0,0); if(e<d) e.setDate(e.getDate()+1); return e;
  }
  d.setMinutes(0,0,0); d.setHours(d.getHours()+1); return d;
}
function timelineHTML(r,st){
  const eat=st.eat||defaultEat(r,st), dough=DOUGHS[st.dough];
  const day=['일','월','화','수','목','금','토'];
  const fmt=d=>`${d.getMonth()+1}/${d.getDate()}(${day[d.getDay()]}) ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const bake=new Date(eat-r.cook*60000);
  const items=[]; let t=new Date(bake-prepMin(r,st.dough)*60000);
  for(const s of dough.stages){items.push({at:new Date(t),txt:`${s.t} (${fmtDur(s.m)})`}); t=new Date(+t+s.m*60000)}
  items.push({at:new Date(bake-25*60000),txt:`루이지 예열 시작 (${r.oven.temp})`,cls:'hot'});
  items.push({at:bake,txt:'도우 펴고 토핑, 굽기',cls:'hot'});
  items.push({at:eat,txt:'첫 판 완성',cls:'eat'});
  items.sort((a,b)=>a.at-b.at);
  const past=items[0].at<new Date();
  return items.map(i=>`<li class="${i.cls||''}"><span class="when">${fmt(i.at)}</span><span class="what">${esc(i.txt)}</span></li>`).join('')
    + (past?`<li><span class="what" style="color:var(--accent)">시작 시간이 이미 지났습니다. 먹는 시간을 늦추거나 당일 도우를 골라 보세요.</span></li>`:'');
}

    <details><summary>테두리는 타는데 가운데가 안 익어요</summary><p>온도를 한 단계 낮추고 시간을 30초 늘립니다. 치즈와 소스를 줄이고, 도우 가운데를 너무 얇게 펴지 않았는지도 확인하세요.</p></details>
    <details><summary>도우가 필에 붙어서 안 내려가요</summary><p>필에 덧가루(세몰리나가 가장 잘 미끄러짐)를 충분히 뿌리고, 토핑은 필 위에서 빠르게 올립니다. 넣기 전 필을 흔들어 도우가 움직이는지 꼭 확인하세요.</p></details>
    <details><summary>펴도 펴도 도우가 줄어들어요</summary><p>반죽이 차갑거나 글루텐이 덜 쉬었습니다. 실온에 30분 더 두면 잘 늘어납니다. 억지로 당기면 구멍이 납니다.</p></details>
    <details><summary>가운데가 질척해요</summary><p>생 모짜렐라의 물기를 충분히 빼지 않았거나 토핑이 많을 때 생깁니다. 모짜렐라는 1시간 이상 물기를 빼고, 1판 80g을 넘기지 마세요.</p></details>
    <details><summary>테두리가 부풀지 않고 납작해요</summary><p>도우를 펼 때 테두리까지 눌렀거나 밀대를 썼을 가능성이 큽니다. 발효가 덜 됐을 때도 그렇습니다. 손가락으로 눌러 천천히 돌아오는 상태인지 확인하세요.</p></details>
  </section>

  <section class="block" aria-labelledby="g-shop">
    <div class="sec-head"><h2 id="g-shop">장보기 · 도구</h2></div>
    <div class="tips">
      <div class="tipbox"><h3>재료</h3><ul>
        <li><b>00 밀가루</b> — 이탈리아산 피자용 00 밀가루. 온라인몰에서 1kg 단위로 쉽게 구합니다. 없으면 강력분으로 대체.</li>
        <li><b>홀토마토</b> — 이탈리아산 통조림. 산마르자노 품종 표기가 있으면 가장 좋습니다.</li>
        <li><b>생 모짜렐라</b> — 물에 담긴 볼 형태. 대형마트 치즈 코너.</li>
        <li><b>인스턴트 드라이이스트</b> — 제과제빵 코너. 개봉 후 냉동 보관.</li>
        <li><b>세몰리나</b> — 덧가루용. 없으면 밀가루나 쌀가루.</li>
      </ul></div>
      <div class="tipbox"><h3>있으면 좋은 도구</h3><ul>
        <li><b>전자저울</b> — 0.1g 단위면 이스트 계량이 쉽습니다.</li>
        <li><b>피자 필</b> — 구성품을 먼저 확인하고, 없으면 30cm 이하 알루미늄 필.</li>
        <li><b>스크래퍼</b> — 반죽 분할과 작업대 정리용.</li>
        <li><b>밀폐용기</b> — 반죽 1덩이당 1개 (약 500ml).</li>
        <li><b>적외선 온도계 (선택)</b> — 스톤 온도 확인. 380~430°C면 나폴리식 굽기 좋습니다.</li>
      </ul></div>
    </div>
    <p class="note" style="margin-top:14px">레시피는 나폴리 피자 협회(AVPN) 방식의 반죽 비율, 뉴욕식 저온숙성 도우, 로마식 피자 비앙카 등 해외 레시피를 참고해 가정용 전기 오븐에 맞게 조정했습니다. 오븐 사양은 판매처 정보 기준이며, 사용 전 제품 설명서를 함께 확인하세요.</p>
  </section>`;
}

/* ---------- 라우팅 ---------- */
const app=$('#app');
function render(){
  const h=location.hash.replace('#','');
  const r=RECIPES.find(x=>x.id===h);
  $('#nav-home').toggleAttribute('aria-current',!r&&h!=='guide'); if(!r&&h!=='guide') $('#nav-home').setAttribute('aria-current','page');
  $('#nav-guide').toggleAttribute('aria-current',h==='guide'); if(h==='guide') $('#nav-guide').setAttribute('aria-current','page');
  app.innerHTML = h==='guide'? viewGuide() : r? viewDetail(r) : viewHome();
  document.title = r? `${r.name} · 루이지 피자 노트` : '루이지 피자 노트';
}
function rerenderDetail(r){const y=scrollY;app.innerHTML=viewDetail(r);scrollTo(0,y)}
window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});

app.addEventListener('click',e=>{
  const fb=e.target.closest('[data-filter]');
  if(fb){filter=fb.dataset.filter;render();return}
  const r=RECIPES.find(x=>x.id===location.hash.slice(1)); if(!r) return;
  const st=getState(r);
  if(e.target.closest('#n-minus')){st.n=Math.max(1,st.n-1);rerenderDetail(r)}
  else if(e.target.closest('#n-plus')){st.n=Math.min(12,st.n+1);rerenderDetail(r)}
  else if(e.target.closest('[data-dough]')){st.dough=e.target.closest('[data-dough]').dataset.dough;st.done.clear();st.eat=null;rerenderDetail(r)}
  else if(e.target.closest('[data-timer]')){const b=e.target.closest('[data-timer]');startTimer(+b.dataset.timer,b.dataset.tname)}
});
app.addEventListener('change',e=>{
  const r=RECIPES.find(x=>x.id===location.hash.slice(1)); if(!r) return;
  const st=getState(r);
  if(e.target.matches('input[type=checkbox][data-key]')){
    const k=e.target.dataset.key; e.target.checked? st.done.add(k):st.done.delete(k);
    e.target.closest('.ing').classList.toggle('done',e.target.checked);
  }
  if(e.target.id==='eat-at'&&e.target.value){st.eat=new Date(e.target.value);$('#timeline').innerHTML=timelineHTML(r,st)}
});

/* ---------- 타이머 ---------- */
let tState=null, ac=null;
function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.setValueAtTime(.18,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.3);o.connect(g).connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.3)})}catch(_){}}
function startTimer(sec,name){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(_){}
  clearInterval(tState?.iv);
  tState={end:Date.now()+sec*1000,left:sec*1000,paused:false,iv:null};
  $('#timer-name').textContent=name||'타이머'; $('#timer').hidden=false; $('#timer').classList.remove('ring'); $('#timer-pause').textContent='일시정지';
  tick(); tState.iv=setInterval(tick,250);
}
function tick(){
  if(!tState||tState.paused) return;
  const left=Math.max(0,tState.end-Date.now()); tState.left=left;
  $('#timer-time').textContent=fmtSec(Math.ceil(left/1000));
  if(left<=0){clearInterval(tState.iv);$('#timer').classList.add('ring');$('#timer-name').textContent='시간 됐어요!';beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(_){}}
}
$('#timer-pause').addEventListener('click',()=>{if(!tState||tState.left<=0)return;tState.paused=!tState.paused;if(!tState.paused)tState.end=Date.now()+tState.left;$('#timer-pause').textContent=tState.paused?'계속':'일시정지'});
$('#timer-close').addEventListener('click',()=>{clearInterval(tState?.iv);tState=null;$('#timer').hidden=true});

render();
</script>
