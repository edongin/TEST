name: 핫딜 알림

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 사정으로 몇 분 늦을 수 있음)
  workflow_dispatch:
    inputs:
      test:
        description: "알림 연결 테스트 메시지만 보내기"
        type: boolean
        default: false

permissions:
  contents: write   # 이미 알린 글 목록(seen.json)을 저장하기 위해 필요

concurrency:
  group: hotdeal-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 연결 테스트
        if: ${{ inputs.test }}
        run: python hotdeal_alert.py --test

      - name: 핫딜 확인
        if: ${{ !inputs.test }}
        run: python hotdeal_alert.py

      - name: 알린 글 목록 저장
        if: ${{ !inputs.test }}
        run: |
          git config user.name "hotdeal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 알린 핫딜 글 목록 갱신 [skip ci]"
            git pull --rebase
            git push
          fi
