; PlatformIO 로 빌드할 때 쓰는 설정 (Arduino IDE 를 쓰면 이 파일은 필요 없습니다)
;   pio run -e pico_w -t upload     <- Raspberry Pi Pico W (UHF Reader for Pico W 보드)
;   pio run -e esp32dev -t upload   <- ESP32 개발보드 / CYD
[platformio]
src_dir = BusArrivalDisplay
default_envs = pico_w

[common]
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  adafruit/Adafruit ILI9341@^1.6.1
  adafruit/Adafruit GFX Library@^1.11.11
  olikraus/U8g2_for_Adafruit_GFX@^1.8.0

[env:pico_w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
monitor_speed = 115200
lib_deps = ${common.lib_deps}

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; 한글 글꼴과 HTTPS 때문에 프로그램이 커서 앱 영역이 큰 파티션을 씁니다.
board_build.partitions = huge_app.csv
lib_deps = ${common.lib_deps}
