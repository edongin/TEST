<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>넘버블럭스 뱀과 사다리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#bfe6fb; --sky2:#e3f5fe;
  --ink:#2b2b40;
  --bs:max(280px, min(calc(100vw - 32px), calc(100vh - 380px), 640px));
}
@media (min-width: 900px){
  :root{ --bs:min(calc(100vw - 400px), calc(100vh - 200px), 820px); }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:linear-gradient(var(--sky1),var(--sky2));
  min-height:100vh; color:var(--ink); overflow-x:hidden;
  padding-bottom:120px;
}
button{font-family:inherit;cursor:pointer;border:none}
.hidden{display:none!important}

/* ---------- 배경 구름 & 행진 ---------- */
.cloud{position:fixed;background:#fff;border-radius:999px;opacity:.75;z-index:0;pointer-events:none;animation:drift linear infinite}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:150%;left:15%;top:-70%}
.cloud::after{width:40%;height:120%;right:12%;top:-45%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

#parade{position:fixed;left:0;right:0;bottom:0;height:130px;pointer-events:none;z-index:0;overflow:hidden}
#parade::before{content:'';position:absolute;left:-10%;right:-10%;bottom:-50px;height:85px;background:linear-gradient(#9be07a,#6cc24a);border-radius:50% 50% 0 0/50px 50px 0 0}
.walker{position:absolute;bottom:16px;left:0;animation:walk linear infinite}
.walker.rev{animation-name:walkR}
.walker .bob{animation:bob .45s ease-in-out infinite alternate;transform-origin:50% 100%}
.walker svg{display:block}
@keyframes walk{from{transform:translateX(-140px)}to{transform:translateX(calc(100vw + 60px))}}
@keyframes walkR{from{transform:translateX(calc(100vw + 60px)) scaleX(-1)}to{transform:translateX(-140px) scaleX(-1)}}
@keyframes bob{from{transform:translateY(0) scaleY(1)}to{transform:translateY(-10px) scaleY(1.03)}}

/* ---------- 공통 ---------- */
.title{margin:0;font-size:clamp(30px,6.4vw,58px);letter-spacing:1px;text-align:center;line-height:1.15}
.title span{display:inline-block;-webkit-text-stroke:2px rgba(0,0,0,.25);text-shadow:0 4px 0 rgba(0,0,0,.15);animation:tbob 1.6s ease-in-out infinite}
.title .sp{width:.35em}
@keyframes tbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.card{position:relative;z-index:2;background:#fff;border-radius:28px;padding:22px;box-shadow:0 8px 0 rgba(0,0,0,.07),0 20px 40px rgba(40,90,140,.18);width:100%;max-width:780px;text-align:center}
.card h2{margin:4px 0 16px;font-size:28px;font-weight:normal}
.btn{font-size:22px;padding:12px 28px;border-radius:999px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.22);transition:transform .08s,box-shadow .08s,opacity .2s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.green{background:#5DC232}.btn.blue{background:#2BB5D8}.btn.red{background:#E8232A}
.btn.orange{background:#F7931E}.btn.purple{background:#7D4CD6}.btn.gray{background:#9aa3ad}.btn.pink{background:#FF3EA5}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px}

/* ---------- 설정 화면 ---------- */
.screen{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px 16px 150px;overflow-y:auto;gap:18px}
.lineup{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:center;gap:clamp(4px,1.6vw,18px);flex-wrap:nowrap;max-width:100%}
.lineup .lu{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.lineup .lu b{font-weight:normal;font-size:clamp(14px,2.6vw,26px)}
.lineup .lu .jumper{transform-origin:50% 100%;animation:bob .7s ease-in-out infinite alternate}
.lineup .lu.jump .jumper{animation:bigjump .6s ease}
@keyframes bigjump{0%{transform:translateY(0)}40%{transform:translateY(-40px) rotate(-8deg)}70%{transform:translateY(0) scale(1.1,.9)}100%{transform:none}}
.count-btns{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.count-btn{background:#f4fbff;border:4px solid #d7eefc;border-radius:24px;padding:14px 22px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:120px;transition:transform .15s}
.count-btn:hover{transform:translateY(-4px);border-color:#2BB5D8}
.count-btn .big{font-size:34px}
.count-btn .names{font-size:15px;color:#667}

.who-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:560px){.who-grid{grid-template-columns:repeat(2,1fr)}}
.who-btn{background:#f6fbff;border:4px solid #e2eef7;border-radius:22px;padding:16px 6px;font-size:28px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
.who-btn .em{font-size:48px;line-height:1}
.who-btn .ck{font-size:16px;color:#aab}
.who-btn.sel{border-color:#FF3EA5;background:#fff0f8;transform:translateY(-4px)}
.who-btn.sel .ck{color:#FF3EA5}
.who-btn.shake{animation:wshake .3s}
@keyframes wshake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pick-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.chip{display:flex;align-items:center;gap:6px;background:#f2f5f8;border-radius:999px;padding:4px 12px 4px 6px;font-size:17px;border:3px solid transparent}
.chip.now{border-color:#FF3EA5;background:#fff0f8}
.chip .q{width:30px;height:30px;border-radius:50%;background:#dde3ea;display:flex;align-items:center;justify-content:center;color:#889}
.char-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.char-card{position:relative;background:#f6fbff;border:4px solid #e2eef7;border-radius:20px;padding:10px 4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:160px;transition:transform .15s,border-color .15s}
.char-card:hover:not(.taken){transform:translateY(-3px)}
.char-card .num{font-size:22px;margin-top:4px}
.char-card.sel{border-color:#FF3EA5;background:#fff0f8;transform:translateY(-4px) scale(1.04)}
.char-card.sel svg{animation:bob .35s ease-in-out infinite alternate}
.char-card.taken{opacity:.35;cursor:not-allowed}
.char-card .owner{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#333;color:#fff;border-radius:999px;padding:1px 10px;font-size:14px;white-space:nowrap}
@media (max-width:560px){.char-card{height:124px}.char-grid{gap:6px}.card{padding:16px 12px}}

.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.mode-grid{grid-template-columns:1fr}}
.mode-card{background:#f6fbff;border:4px solid #e2eef7;border-radius:22px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:22px}
.mode-card small{font-size:15px;color:#667}
.mode-card.sel{border-color:#5DC232;background:#f1fbe9}
.mode-card .dice-prev{display:flex;gap:10px;align-items:center;height:64px}
.opt-row{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center;font-size:18px}
.pill{background:#eef3f7;border:3px solid transparent;border-radius:999px;padding:8px 16px;font-size:17px}
.pill.sel{border-color:#2BB5D8;background:#e6f7fc}

/* ---------- 게임 화면 ---------- */
#game{position:relative;z-index:2;padding:10px 16px 0}
.game-head{display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.game-head .title{font-size:clamp(24px,4vw,40px)}
.game-main{display:flex;flex-direction:column;align-items:center;gap:16px}
@media (min-width: 900px){.game-main{flex-direction:row;align-items:flex-start;justify-content:center}}

.board-wrap{position:relative;width:var(--bs);height:calc(var(--bs) * 1.13);flex:none}
.board{position:absolute;left:0;top:0;width:var(--bs);height:var(--bs);display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);border-radius:16px;overflow:hidden;box-shadow:0 0 0 6px #fff,0 12px 30px rgba(40,90,140,.25)}
.cell{position:relative;padding:5% 7%;font-size:calc(var(--bs) * .03);line-height:1}
.cell .n{position:relative;z-index:1}
.cell.c10{box-shadow:inset 0 0 0 calc(var(--bs) * .004) #E2231A}
.cell .lbl{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-size:calc(var(--bs) * .02)}
#overlay{position:absolute;left:0;top:0;width:var(--bs);height:var(--bs);pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
#tokens{position:absolute;left:0;top:0;width:var(--bs);height:var(--bs);pointer-events:none}
.start-pad{position:absolute;left:0;top:calc(var(--bs) + 10px);width:var(--bs);height:calc(var(--bs) * .12 - 6px);background:rgba(255,255,255,.65);border-radius:16px;display:flex;align-items:center;padding-left:2.5%;font-size:calc(var(--bs) * .032);color:#E8232A}

.token{position:absolute;width:calc(var(--bs) * .085);height:calc(var(--bs) * .1);transform:translate(-50%,-62%);z-index:5}
.token .tk-inner{width:100%;height:100%;transform-origin:50% 100%;transition:transform .12s}
.token.land .tk-inner{transform:scale(1.18,.8)}
.token.active{z-index:9}
.token.active::before{content:'▼';position:absolute;top:-38%;left:50%;transform:translateX(-50%);color:#FF3EA5;font-size:calc(var(--bs) * .034);animation:arrow .5s ease-in-out infinite alternate;text-shadow:0 0 3px #fff,0 0 3px #fff}
@keyframes arrow{from{margin-top:0}to{margin-top:-6px}}
.tk-inner svg{filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.4))}
.tk-name{position:absolute;bottom:-16%;left:50%;transform:translateX(-50%);font-size:calc(var(--bs) * .018);background:#fff;border-radius:8px;padding:1px 5px;white-space:nowrap;border:2px solid var(--pc);line-height:1.1}
.token.done .tk-inner{transform:scale(.8)}

#toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.3);opacity:0;z-index:20;background:#fff;border-radius:22px;padding:12px 24px;font-size:calc(var(--bs) * .05);white-space:nowrap;box-shadow:0 8px 0 rgba(0,0,0,.1),0 10px 30px rgba(0,0,0,.25);border:5px solid #2BB5D8;pointer-events:none;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast.good{border-color:#5DC232;color:#2E7D1B}
#toast.bad{border-color:#E8232A;color:#B8141B}
#toast.bump{border-color:#F7931E;color:#B5600A}
#toast.win{border-color:#F9D71C;color:#8a6d00;font-size:calc(var(--bs) * .07)}

.panel{width:min(100%, calc(100vw - 32px), 640px);display:flex;flex-direction:column;gap:12px}
@media (min-width: 900px){.panel{width:320px}}
.pbox{background:#fff;border-radius:22px;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.06),0 12px 24px rgba(40,90,140,.14)}
.turn-card{display:flex;align-items:center;gap:12px;border:4px solid var(--pc,#ddd)}
.turn-card .tc-char{height:80px;display:flex;align-items:flex-end}
.turn-card .tc-char svg{animation:bob .4s ease-in-out infinite alternate;transform-origin:50% 100%}
.turn-label{font-size:16px;color:#778}
.turn-name{font-size:34px}
.dice-box{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:190px;justify-content:center}
.dice-show{display:flex;align-items:center;gap:10px;min-height:76px}
.eq{font-size:30px;min-height:38px}
.eq .ans{color:#E8232A}
.result-blocks{display:flex;align-items:flex-end;gap:8px;min-height:10px}
.result-blocks .rb{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.result-blocks .plus{font-size:26px;align-self:center}
@keyframes pop{from{transform:scale(0) translateY(20px)}to{transform:none}}
.roll-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.roll-btns .btn{font-size:22px;padding:12px 20px}
.msg{font-size:18px;text-align:center;min-height:24px;color:#556}

.die{width:68px;height:68px;border-radius:14px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 4px 8px rgba(0,0,0,.2)}
.die i{display:block;width:70%;height:70%;margin:auto;border-radius:50%}
.die.rolling{animation:shake .14s linear infinite}
@keyframes shake{0%{transform:rotate(-12deg) translateY(-4px)}50%{transform:rotate(12deg) translateY(2px)}100%{transform:rotate(-12deg) translateY(-4px)}}
.die.d12,.die.d4{display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);border-radius:0;box-shadow:none;padding:0}
.die.d12{clip-path:polygon(50% 0,79% 9%,97% 34%,97% 66%,79% 91%,50% 100%,21% 91%,3% 66%,3% 34%,21% 9%)}
.die.d4{clip-path:polygon(50% 2%,100% 96%,0 96%);padding-top:22px;font-size:28px}
.die.small{width:46px;height:46px;padding:6px;font-size:22px;border-radius:10px}
.die.small.d4{padding-top:14px;font-size:20px}
.op{width:52px;height:52px;border-radius:50%;background:#333;color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.op.plus{background:#2BB5D8}.op.times{background:#FF3EA5}
.op.rolling{animation:spin .25s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:16px;border:3px solid transparent;background:#f6f9fc}
.prow.now{border-color:var(--pc);background:#fff}
.prow .pc{width:44px;height:48px;display:flex;align-items:flex-end;justify-content:center}
.prow .pn{font-size:21px;flex:1}
.prow .pp{font-size:18px;color:#667}
.prow .rk{font-size:18px;background:#F9D71C;border-radius:999px;padding:2px 10px;color:#5a4500}
.mini-btns{display:flex;gap:10px;justify-content:center}
.mini-btns .btn{font-size:17px;padding:8px 16px}
.dock{display:flex;flex-direction:column;gap:12px}
@media (max-width: 899px){
  .game-head .title{font-size:24px}
  .dock{display:grid;grid-template-columns:auto 1fr;gap:8px}
  .turn-card{flex-direction:column;justify-content:center;gap:2px;padding:8px 10px;text-align:center}
  .turn-card .tc-char{height:56px}
  .turn-card .tc-char svg{height:56px;width:auto}
  .turn-label{font-size:13px}.turn-name{font-size:24px}
  .dice-box{min-height:0;gap:4px}
  .dice-show{min-height:52px;gap:6px}
  .die{width:50px;height:50px;padding:6px;font-size:24px}
  .die.d4{padding-top:16px;font-size:22px}
  .op{width:38px;height:38px;font-size:24px}
  .eq{font-size:22px;min-height:26px}
  .result-blocks svg{height:44px;width:auto}
  .result-blocks .plus{font-size:18px}
  .roll-btns{gap:6px;margin-top:6px}
  .roll-btns .btn{font-size:17px;padding:9px 14px}
  .msg{font-size:15px;min-height:18px;margin-top:4px}
  .pbox{padding:10px}
}

/* ---------- 끝 화면 ---------- */
#endScreen{z-index:60;background:rgba(191,230,251,.85);justify-content:center}
.end-card{max-width:620px}
.crown{font-size:clamp(28px,6vw,44px);color:#d4a100}
.win-char{display:flex;justify-content:center;align-items:flex-end;height:200px;margin:10px 0}
.win-char svg{animation:dance .5s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes dance{from{transform:rotate(-7deg) translateY(0)}to{transform:rotate(7deg) translateY(-14px)}}
.win-name{font-size:clamp(64px,15vw,140px);line-height:1;-webkit-text-stroke:3px rgba(0,0,0,.2);text-shadow:0 6px 0 rgba(0,0,0,.12)}
.win-sub{font-size:26px;margin-top:6px}
.others{margin-top:18px;display:flex;flex-direction:column;gap:8px;align-items:center}
.others .orow{display:flex;align-items:center;gap:12px;font-size:24px;background:#f6f9fc;border-radius:16px;padding:6px 18px;min-width:260px}
.others .orow .rkb{font-size:20px;background:#dde5ee;border-radius:999px;padding:2px 12px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:61}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>

<div id="clouds"></div>
<div id="parade"></div>

<!-- 1. 인원 선택 -->
<section id="scrCount" class="screen">
  <h1 class="title" data-title="넘버블럭스 뱀과 사다리"></h1>
  <div class="lineup" id="lineup"></div>
  <div class="card">
    <h2>몇 명이 함께 할까요?</h2>
    <div class="count-btns" id="countBtns"></div>
  </div>
</section>

<!-- 1-2. 누가 할까요 -->
<section id="scrWho" class="screen hidden">
  <h1 class="title" data-title="누가 할까요?"></h1>
  <div class="card">
    <h2 id="whoTitle"></h2>
    <div class="who-grid" id="whoGrid"></div>
    <div class="row">
      <button class="btn gray" id="whoBack">◀ 뒤로</button>
      <button class="btn green" id="whoOk">다음 ▶</button>
    </div>
  </div>
</section>

<!-- 2. 캐릭터 선택 -->
<section id="scrChar" class="screen hidden">
  <h1 class="title" data-title="캐릭터 고르기"></h1>
  <div class="card">
    <div class="pick-chips" id="pickChips"></div>
    <h2 id="pickTitle"></h2>
    <div class="char-grid" id="charGrid"></div>
    <div class="row">
      <button class="btn gray" id="pickCancel">◀ 취소</button>
      <button class="btn green" id="pickOk" disabled>선택 ✔</button>
    </div>
  </div>
</section>

<!-- 3. 주사위 모드 -->
<section id="scrMode" class="screen hidden">
  <h1 class="title" data-title="주사위 고르기"></h1>
  <div class="card">
    <h2>어떤 주사위로 할까요?</h2>
    <div class="mode-grid">
      <button class="mode-card sel" data-mode="normal">
        <div class="dice-prev" id="prevNormal"></div>
        일반 주사위
        <small>1~6 주사위, 1~12 주사위 중 골라서 굴려요</small>
      </button>
      <button class="mode-card" data-mode="math">
        <div class="dice-prev" id="prevMath"></div>
        덧셈 · 곱셈 주사위
        <small>1~4 주사위 2개! 더하기나 곱하기가 랜덤으로 나와요</small>
      </button>
    </div>
    <div class="opt-row">🏁 100칸에 <b style="color:#E8232A">딱 맞게</b> 도착해야 들어갈 수 있어요!</div>
    <div class="row">
      <button class="btn gray" id="modeBack">◀ 뒤로</button>
      <button class="btn pink" id="startBtn">게임 시작! ▶</button>
    </div>
  </div>
</section>

<!-- 게임 -->
<section id="game" class="hidden">
  <div class="game-head"><h1 class="title" data-title="넘버블럭스 뱀과 사다리"></h1></div>
  <div class="game-main">
    <div class="board-wrap">
      <div class="board" id="board"></div>
      <svg id="overlay" viewBox="0 0 1000 1000"></svg>
      <div class="start-pad">출발 ▶</div>
      <div id="tokens"></div>
      <div id="toast"></div>
    </div>
    <div class="panel">
      <div class="dock">
      <div class="pbox turn-card" id="turnCard">
        <div class="tc-char" id="turnChar"></div>
        <div><div class="turn-label">지금 차례</div><div class="turn-name" id="turnName"></div></div>
      </div>
      <div class="pbox">
        <div class="dice-box">
          <div class="dice-show" id="diceShow"></div>
          <div class="eq" id="eqShow"></div>
          <div class="result-blocks" id="resultBlocks"></div>
        </div>
        <div class="roll-btns" id="rollBtns"></div>
        <div class="msg" id="msg"></div>
      </div>
      </div>
      <div class="pbox plist" id="plist"></div>
      <div class="mini-btns">
        <button class="btn blue" id="muteBtn">🔊 소리</button>
        <button class="btn gray" id="homeBtn">🏠 처음으로</button>
      </div>
    </div>
  </div>
</section>

<!-- 끝 화면 -->
<section id="endScreen" class="screen hidden">
  <div class="confetti" id="confetti"></div>
  <div class="card end-card">
    <div class="crown">👑 1등 👑</div>
    <div class="win-char" id="winChar"></div>
    <div class="win-name" id="winName"></div>
    <div class="win-sub">축하해요! 🎉</div>
    <div class="others" id="others"></div>
    <div class="row">
      <button class="btn green" id="againBtn">🔁 다시 하기</button>
      <button class="btn blue" id="endHomeBtn">🏠 처음으로</button>
    </div>
  </div>
</section>

<script>
/* =========================================================
   넘버블럭스 캐릭터 (SVG로 직접 그림)
   ========================================================= */
const RAINBOW = ['#E8232A','#F7931E','#F9D71C','#5DC232','#4FC3F7','#3F51B5','#9C4DCC']; // 아래 → 위
const NB = {
  1:{c:'#E8232A', cols:1, rows:1},
  2:{c:'#F7931E', cols:1, rows:2},
  3:{c:'#F9D71C', cols:1, rows:3},
  4:{c:'#5DC232', cols:2, rows:2},
  5:{c:'#2BB5D8', cols:1, rows:5},
  6:{c:'#7D4CD6', cols:2, rows:3},
  7:{c:'#9C4DCC', cols:1, rows:7},
  8:{c:'#FF3EA5', cols:2, rows:4},
  9:{c:'#A9A9A9', cols:3, rows:3},
  10:{c:'#FFFFFF', cols:2, rows:5},
};
const NAMES = ['지섭','엄마','아빠','손님'];

function shade(hex, amt){
  const c = hex.replace('#','');
  let r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
  if(amt<0){ r*=1+amt; g*=1+amt; b*=1+amt; }
  else { r+= (255-r)*amt; g+=(255-g)*amt; b+=(255-b)*amt; }
  return '#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
}
function nbColor(n){ return n===10 ? '#E2231A' : n===7 ? '#9C4DCC' : NB[n].c; }
function nbText(n){ return n===3 ? '#B89300' : n===10 ? '#E2231A' : shade(nbColor(n), -0.25); }

function starPts(cx,cy,R,r,n=5,rot=-90){
  const p=[];
  for(let i=0;i<n*2;i++){
    const a=(rot+i*180/n)*Math.PI/180, rr=i%2?r:R;
    p.push((cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1));
  }
  return p.join(' ');
}
const f1 = v => +v.toFixed(1);
function eyeSVG(x,y,r){
  return `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(r)}" ry="${f1(r*1.12)}" fill="#fff" stroke="#3a2a2a" stroke-width="1.2"/>`+
         `<circle cx="${f1(x)}" cy="${f1(y+r*.18)}" r="${f1(r*.52)}" fill="#2a1f2f"/>`+
         `<circle cx="${f1(x-r*.18)}" cy="${f1(y-r*.02)}" r="${f1(r*.17)}" fill="#fff"/>`;
}
function mouthSVG(x,y,w,d){
  return `<path d="M${f1(x-w)} ${f1(y)} Q ${f1(x)} ${f1(y+d*2)} ${f1(x+w)} ${f1(y)} Q ${f1(x)} ${f1(y+d*.55)} ${f1(x-w)} ${f1(y)} Z" fill="#7a1f30" stroke="#4a1220" stroke-width="1"/>`;
}

function lipsSVG(x,y,w,d,lip,lw=2.6){
  return `<path d="M${f1(x-w)} ${f1(y)} Q ${f1(x)} ${f1(y+d*2)} ${f1(x+w)} ${f1(y)} Q ${f1(x)} ${f1(y+d*.5)} ${f1(x-w)} ${f1(y)} Z" fill="#6b1020" stroke="${lip}" stroke-width="${lw}" stroke-linejoin="round"/>`+
         `<path d="M${f1(x-w*.55)} ${f1(y+d*.5)} Q ${f1(x)} ${f1(y+d*.95)} ${f1(x+w*.55)} ${f1(y+d*.5)}" stroke="#fff" stroke-width="1.6" fill="none"/>`;
}
// 둥근 네모 눈 (lid: 아래 눈꺼풀 색)
function sqEye(x,y,w,h,rim,rw,lid,look=0){
  const rx=Math.min(w,h)*.32;
  let e=`<rect x="${f1(x-w/2)}" y="${f1(y-h/2)}" width="${w}" height="${h}" rx="${f1(rx)}" fill="#fff"/>`;
  const py = lid ? y-h*.08 : y+h*.04, pr=Math.min(w,h)*.2;
  e+=`<circle cx="${f1(x+look)}" cy="${f1(py)}" r="${f1(pr)}" fill="#1a1a1a"/><circle cx="${f1(x+look-pr*.35)}" cy="${f1(py-pr*.35)}" r="${f1(pr*.3)}" fill="#fff"/>`;
  if(lid){
    e+=`<rect x="${f1(x-w/2)}" y="${f1(y+h*.1)}" width="${w}" height="${f1(h*.4)}" rx="${f1(rx)}" fill="${lid}"/>`;
    e+=`<rect x="${f1(x-w/2)}" y="${f1(y+h*.1)}" width="${w}" height="${f1(h*.2)}" fill="${lid}"/>`;
  }
  e+=`<rect x="${f1(x-w/2)}" y="${f1(y-h/2)}" width="${w}" height="${h}" rx="${f1(rx)}" fill="none" stroke="${rim}" stroke-width="${rw}"/>`;
  return e;
}
// 손가락 있는 장갑 (k: -1 왼쪽 / 1 오른쪽)
function gloveSVG(x,y,k,g){
  let s=`<g transform="translate(${f1(x)} ${f1(y)}) rotate(${k*g.rot}) scale(${f1(-k*g.sc)} ${g.sc})">`;
  [[-5.2,-2],[-1.7,-3.2],[1.8,-3],[5.3,-1.8]].forEach(([fx,fy],i)=>
    s+=`<rect x="${f1(fx-1.9)}" y="${f1(fy-10)}" width="3.8" height="11" rx="1.9" fill="${g.fill}" stroke="${g.stroke}" stroke-width=".9" transform="rotate(${(i-1.5)*9} ${fx} ${fy})"/>`);
  s+=`<rect x="-12" y="-1" width="3.8" height="9" rx="1.9" fill="${g.fill}" stroke="${g.stroke}" stroke-width=".9" transform="rotate(-55 -9 3)"/>`;
  s+=`<rect x="-7.5" y="-4" width="15" height="13" rx="5" fill="${g.fill}" stroke="${g.stroke}" stroke-width=".9"/>`;
  if(g.star) s+=`<polygon points="${starPts(0,2.5,3.8,1.7)}" fill="${g.star}"/>`;
  return s+'</g>';
}

let nbUid = 0;
/** n: 1~10, h: 픽셀 높이(없으면 100% 채움) */
function nbSVG(n, h){
  const d=NB[n], U=40, cols=d.cols, rows=d.rows;
  const W=cols*U, H=rows*U, M=([5,6,10].includes(n)?U*.8:U*.62), T=U*.62, B=U*.42;
  const VW=W+2*M, VH=T+H+B, x0=M, y0=T, cx=x0+W/2;
  const id='nbg'+(nbUid++);
  const size = h ? `width="${f1(h*VW/VH)}" height="${h}"` : `width="100%" height="100%"`;
  const base = n===7 ? '#5E3FA0' : n===10 ? '#E2231A' : n===9 ? '#7d8590' : shade(d.c,-.3);
  const LIMB = {8:'#7A2E4A', 4:'#2C7A1A', 5:'#1F3F8A', 6:'#9C2547', 7:'#6A3FB0', 9:'#4A5A72', 10:'#E2231A'};
  const limb = LIMB[n] || shade(d.c,-.22);
  let s=`<svg ${size} viewBox="0 0 ${f1(VW)} ${f1(VH)}" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".14"/></linearGradient></defs>`;

  // 다리
  const legW=U*.22, lx=Math.min(W*.25,U*.42);
  if(n===8) [-1,1].forEach(k=>{
    const x=cx+k*lx;
    s+=`<path d="M${f1(x)} ${f1(y0+H-4)} C ${f1(x)} ${f1(y0+H+10)}, ${f1(x+k*4)} ${f1(VH-3)}, ${f1(x+k*13)} ${f1(VH-6)}" stroke="${limb}" stroke-width="6" stroke-linecap="round" fill="none"/>`;
  });
  else [-1,1].forEach(k=>{
    const x=cx+k*lx;
    s+=`<rect x="${f1(x-legW/2)}" y="${f1(y0+H-6)}" width="${f1(legW)}" height="${f1(B+2)}" rx="${f1(legW/2)}" fill="${limb}"/>`;
    s+=`<ellipse cx="${f1(x+k*3)}" cy="${f1(VH-3.5)}" rx="${f1(legW*.9)}" ry="3.5" fill="${shade(limb,-.2)}"/>`;
  });

  // 팔: mode = down / up / out, hand = null(동그란 손) 또는 장갑 설정
  function arm(k, ayy, mode, hand){
    const sx = k<0 ? x0+3 : x0+W-3;
    let ex, ey;
    if(mode==='up'){ ex=sx+k*M*.6; ey=ayy-U*.8; }
    else if(mode==='out'){ ex=sx+k*M*.7; ey=ayy-U*.5; }
    else { ex=sx+k*M*.72; ey=ayy+U*.55; }
    s+=`<path d="M${f1(sx)} ${f1(ayy)} Q ${f1(sx+k*M*.6)} ${f1(ayy+(mode==='down'?U*.05:-U*.05))} ${f1(ex)} ${f1(ey)}" stroke="${limb}" stroke-width="${f1(U*.2)}" stroke-linecap="round" fill="none"/>`;
    if(hand) s+=gloveSVG(ex, ey, k, hand);
    else s+=`<circle cx="${f1(ex)}" cy="${f1(ey)}" r="${f1(U*.15)}" fill="${limb}"/>`;
  }
  const ay = n===6 ? y0+U*1.5 : n===10 ? y0+U*1.25 : y0 + Math.min(H*.42, U*1.15);
  if(n===5){ arm(-1, ay, 'down'); arm(1, ay, 'up', {fill:'#1F4E9C', stroke:'#173B78', star:'#4FC3F7', rot:18, sc:1.15}); }
  else if(n===7){ arm(-1, y0+U*.75, 'up'); arm(1, y0+U*.75, 'up'); }
  else if(n===10){ const g={fill:'#fff', stroke:'#E2231A', star:'#E2231A', rot:38, sc:1.2}; arm(-1, ay, 'out', g); arm(1, ay, 'out', g); }
  else if(n===1){
    // 짧은 물방울 모양 팔
    [-1,1].forEach(k=>{
      const sx = k<0 ? x0+3 : x0+W-3, sy=y0+U*.72;
      s+=`<path d="M${f1(sx)} ${f1(sy)} L ${f1(sx+k*6)} ${f1(sy+U*.5)}" stroke="${limb}" stroke-width="6.5" stroke-linecap="round"/>`;
      s+=`<ellipse cx="${f1(sx+k*6.5)}" cy="${f1(sy+U*.52)}" rx="5" ry="6" fill="${limb}"/>`;
    });
  }
  else if(n===8){
    // 양쪽에 꼬불꼬불한 팔 3개씩 (다리 2개와 합쳐 8개)
    [-1,1].forEach(k=>{
      const ex = k<0 ? x0+2 : x0+W-2;
      [1.15,2.05,2.95].forEach(t=>{
        const y=y0+U*t;
        s+=`<path d="M${f1(ex)} ${f1(y)} C ${f1(ex+k*20)} ${f1(y-8)}, ${f1(ex+k*22)} ${f1(y+22)}, ${f1(ex)} ${f1(y+19)}" stroke="${limb}" stroke-width="6" stroke-linecap="round" fill="none"/>`;
      });
    });
  }
  else { arm(-1, ay, 'down'); arm(1, ay, 'down'); }

  // 몸 블록
  const NINE=['#9C9C9C','#B6B6B6','#CFCFCF'];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const fill = n===7 ? RAINBOW[rows-1-r] : n===9 ? NINE[r] : d.c;
    const st = n===10 ? '#E2231A' : shade(fill,-.22);
    s+=`<rect x="${f1(x0+c*U)}" y="${f1(y0+r*U)}" width="${U}" height="${U}" fill="${fill}" stroke="${st}" stroke-width="${n===10?2:1.5}"/>`;
  }
  s+=`<rect x="${f1(x0)}" y="${f1(y0)}" width="${W}" height="${H}" rx="3" fill="url(#${id})" stroke="${base}" stroke-width="${n===10?3.2:2}"/>`;

  // 특별 장식
  if(n===6){
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++)
      s+=`<circle cx="${f1(x0+c*U+U/2)}" cy="${f1(y0+r*U+U/2)}" r="${f1(U*.19)}" fill="#8D9CF6"/>`;
  }
  if(n===3){
    [1.3,1.65,2.0].forEach(t=> s+=`<circle cx="${f1(cx)}" cy="${f1(y0+U*t)}" r="${f1(U*.085)}" fill="#E8232A"/>`);
    s+=`<polygon points="${f1(x0)},${f1(y0+3)} ${f1(x0-5)},${f1(y0-T*.72)} ${f1(x0+W*.27)},${f1(y0-T*.18)} ${f1(cx)},${f1(y0-T*.82)} ${f1(x0+W*.73)},${f1(y0-T*.18)} ${f1(x0+W+5)},${f1(y0-T*.72)} ${f1(x0+W)},${f1(y0+3)}" fill="#E8232A" stroke="#B8141B" stroke-width="1.5"/>`;
    [[x0-5,y0-T*.72],[cx,y0-T*.82],[x0+W+5,y0-T*.72]].forEach(p=> s+=`<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="3.6" fill="#F9D71C" stroke="#C9A400" stroke-width="1"/>`);
  }
  if(n===7){
    ['#E8232A','#F7931E','#F9D71C','#5DC232','#4FC3F7','#9C4DCC'].forEach((col,i)=>{
      const dx=(i-2.5)*4.2;
      s+=`<path d="M${f1(cx+dx*.4)} ${f1(y0+1)} Q ${f1(cx+dx*.9)} ${f1(y0-T*.45)} ${f1(cx+dx*1.5)} ${f1(y0-T*.85)}" stroke="${col}" stroke-width="3.6" stroke-linecap="round" fill="none"/>`;
    });
  }

  // 얼굴
  const fs = cols===1 ? 1 : cols===2 ? 1.45 : 1.85;
  const eyeY = y0+U*.4*fs, er=U*.15*fs, edx=U*.2*fs;
  if(n===1){
    s+=eyeSVG(cx, y0+U*.4, U*.26);
    s+=mouthSVG(cx, y0+U*.76, U*.14, U*.09);
  } else if(n===4){
    // 네모난 눈 + 블록 두 개로 된 진한 눈썹
    [-1,1].forEach(k=>{
      const ex=cx+k*17;
      s+=sqEye(ex, y0+23, 22, 20, '#2C6E17', 3.6, null, -k*1.2);
      s+=`<g transform="rotate(${k*12} ${f1(ex)} ${f1(y0+4)})">`+
         `<rect x="${f1(ex-11)}" y="${f1(y0-2)}" width="11" height="10" rx="2" fill="#2A6A16" stroke="#1B4A0C" stroke-width="1"/>`+
         `<rect x="${f1(ex)}" y="${f1(y0-2)}" width="11" height="10" rx="2" fill="#2A6A16" stroke="#1B4A0C" stroke-width="1"/></g>`;
    });
    s+=`<path d="M${f1(cx-12)} ${f1(y0+46)} Q ${f1(cx)} ${f1(y0+61)} ${f1(cx+13)} ${f1(y0+45)} Q ${f1(cx)} ${f1(y0+51)} ${f1(cx-12)} ${f1(y0+46)} Z" fill="#fff" stroke="#2C6E17" stroke-width="3.4" stroke-linejoin="round"/>`;
  } else if(n===5){
    // 왼쪽 눈은 별 모양
    const ey=y0+13;
    s+=`<polygon points="${starPts(cx-9, ey, 12.5, 6.4)}" fill="#1F4E9C" stroke="#173B78" stroke-width="1" stroke-linejoin="round"/>`;
    s+=`<circle cx="${f1(cx+9)}" cy="${f1(ey)}" r="7.8" fill="#1F4E9C"/>`;
    s+=eyeSVG(cx-9, ey, 5.6) + eyeSVG(cx+9, ey, 5.6);
    s+=lipsSVG(cx, y0+31, 8, 4.5, '#E8697A');
  } else if(n===6){
    // 양옆으로 튀어나온 빨간 눈 (속눈썹 3개)
    const ey=y0+U*.95;
    [-1,1].forEach(k=>{
      const ex = k<0 ? x0-1 : x0+W+1;
      [-1,0,1].forEach(j=> s+=`<path d="M${f1(ex+j*4)} ${f1(ey-8)} Q ${f1(ex+j*6)} ${f1(ey-14)} ${f1(ex+j*7)} ${f1(ey-19)}" stroke="#E8232A" stroke-width="3.8" stroke-linecap="round" fill="none"/>`);
      s+=`<circle cx="${f1(ex)}" cy="${f1(ey)}" r="11.5" fill="#E8232A" stroke="#B8141B" stroke-width="1"/>`;
      s+=`<ellipse cx="${f1(ex)}" cy="${f1(ey-1)}" rx="7.8" ry="7" fill="#fff"/>`;
      s+=`<circle cx="${f1(ex+k*2.2)}" cy="${f1(ey-1.8)}" r="3.4" fill="#1a1a1a"/><circle cx="${f1(ex+k*2.2-1)}" cy="${f1(ey-3)}" r="1" fill="#fff"/>`;
      s+=`<path d="M${f1(ex-8.5)} ${f1(ey+.8)} Q ${f1(ex)} ${f1(ey+3.2)} ${f1(ex+8.5)} ${f1(ey+.8)} L ${f1(ex+8.5)} ${f1(ey+8)} L ${f1(ex-8.5)} ${f1(ey+8)} Z" fill="#E8232A"/>`;
    });
    s+=lipsSVG(cx, y0+U*1.45, 15, 5, '#E86AA8', 4);
  } else if(n===7){
    // 노란 테 고글 눈
    const ey=y0+12;
    s+=`<line x1="${f1(cx-3)}" y1="${f1(ey)}" x2="${f1(cx+3)}" y2="${f1(ey)}" stroke="#F9D71C" stroke-width="2.6"/>`;
    [-1,1].forEach(k=>{
      const ex=cx+k*9.5;
      s+=`<rect x="${f1(ex-7.5)}" y="${f1(ey-6)}" width="15" height="12" rx="4" fill="#fff" stroke="#F9D71C" stroke-width="3"/>`;
      s+=`<circle cx="${f1(ex+k*.6)}" cy="${f1(ey+.8)}" r="3" fill="#1a1a1a"/><circle cx="${f1(ex+k*.6-1)}" cy="${f1(ey-.4)}" r=".9" fill="#fff"/>`;
    });
    s+=lipsSVG(cx, y0+27, 8, 4.5, '#F9D71C');
  } else if(n===9){
    // 둥근 네모 눈 + 아래 눈꺼풀, 안쪽이 올라간 두꺼운 눈썹
    [-1,1].forEach(k=>{
      const ex=cx+k*25;
      s+=sqEye(ex, y0+30, 30, 27, '#4A5A72', 4.5, '#4A5A72', 0);
      s+=`<path d="M${f1(cx+k*43)} ${f1(y0+1)} Q ${f1(cx+k*27)} ${f1(y0-7)} ${f1(cx+k*11)} ${f1(y0-10)}" stroke="#4A5A72" stroke-width="13" stroke-linecap="round" fill="none"/>`;
    });
    s+=`<path d="M${f1(cx-30)} ${f1(y0+61)} Q ${f1(cx-4)} ${f1(y0+81)} ${f1(cx+31)} ${f1(y0+63)}" stroke="#4A5A72" stroke-width="8" stroke-linecap="round" fill="none"/>`;
  } else if(n===10){
    // 블록 한 칸을 꽉 채우는 큰 별 눈
    [-1,1].forEach(k=>{
      const ex=cx+k*20, ey=y0+19;
      s+=`<polygon points="${starPts(ex, ey, 19.5, 10)}" fill="#E2231A" stroke="#B8141B" stroke-width="1" stroke-linejoin="round"/>`;
      s+=eyeSVG(ex, ey+1, 7.4);
    });
    s+=lipsSVG(cx, y0+46, 9, 4, '#E8A090');
  } else {
    if(n===8) [-1,1].forEach(k=> s+=`<polygon points="${starPts(cx+k*edx, eyeY, er*2.05, er*1.45, 9)}" fill="#D77DB8" stroke="#B0507F" stroke-width="1.2" stroke-linejoin="round"/>`);
    s+=eyeSVG(cx-edx, eyeY, er) + eyeSVG(cx+edx, eyeY, er);
    if(n===2){
      [-1,1].forEach(k=> s+=`<circle cx="${f1(cx+k*edx)}" cy="${f1(eyeY)}" r="${f1(er+2.6)}" fill="none" stroke="#8E44AD" stroke-width="2.4"/>`);
      s+=`<line x1="${f1(cx-edx+er+2.6)}" y1="${f1(eyeY)}" x2="${f1(cx+edx-er-2.6)}" y2="${f1(eyeY)}" stroke="#8E44AD" stroke-width="2.4"/>`;
    }
    if(n===8) s+=`<rect x="${f1(cx-7)}" y="${f1(y0+U*1.3)}" width="14" height="4.5" rx="2.2" fill="#8C7D88" stroke="#6b5c68" stroke-width="1"/>`;
    else s+=mouthSVG(cx, eyeY+er+U*.2*fs, U*.2*fs, U*.1*fs);
  }
  s+='</svg>';
  return s;
}
/** 실제 쇼처럼 블록 수에 비례한 크기 */
function nbSized(n, unitPx){
  const d=NB[n];
  return nbSVG(n, Math.round((d.rows + 1.04)*unitPx));
}

/* =========================================================
   소리 (Web Audio)
   ========================================================= */
let AC=null, muted=false;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(freq, dur=.12, type='sine', vol=.12, delay=0, slideTo=null){
  if(muted) return; const a=ac(); if(!a) return;
  const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
const sfx = {

function buildBoard(){

      board.appendChild(cell);
    }
  }
  drawOverlay();
}

const snakePaths = {};
function drawOverlay(){
  let s='';
  // 사다리
  Object.entries(LADDERS).forEach(([a,b],li)=>{
    const A=cellXY(+a), B=cellXY(+b);
    const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy), nx=-dy/L*17, ny=dx/L*17;
    const ex=dx/L*18, ey=dy/L*18; // 끝을 살짝 늘림
    const a1={x:A.x-ex,y:A.y-ey}, b1={x:B.x+ex,y:B.y+ey};
    const cnt=Math.max(3,Math.round(L/42));
    for(let i=1;i<cnt;i++){
      const t=i/cnt, px=A.x+dx*t, py=A.y+dy*t;
      s+=`<line x1="${f1(px-nx)}" y1="${f1(py-ny)}" x2="${f1(px+nx)}" y2="${f1(py+ny)}" stroke="${RAINBOW[(i+li)%7]}" stroke-width="8" stroke-linecap="round"/>`;
    }
    [-1,1].forEach(k=>{
      s+=`<line x1="${f1(a1.x+k*nx)}" y1="${f1(a1.y+k*ny)}" x2="${f1(b1.x+k*nx)}" y2="${f1(b1.y+k*ny)}" stroke="#8B5A2B" stroke-width="10" stroke-linecap="round"/>`;
      s+=`<line x1="${f1(a1.x+k*nx)}" y1="${f1(a1.y+k*ny)}" x2="${f1(b1.x+k*nx)}" y2="${f1(b1.y+k*ny)}" stroke="#D9A066" stroke-width="4" stroke-linecap="round"/>`;
    });
  });
  // 뱀
  Object.entries(SNAKES).forEach(([h,t],si)=>{
    const A=cellXY(+h), B=cellXY(+t);
    const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy), ux=-dy/L, uy=dx/L;
    const waves=Math.max(1.2, L/230), amp=30, N=60, pts=[];
    for(let i=0;i<=N;i++){
      const u=i/N, fade = u<.12 ? u/.12 : u>.9 ? (1-u)/.1*0.6+0.4 : 1;
      const off=Math.sin(u*Math.PI*2*waves)*amp*fade;
      pts.push({x:A.x+dx*u+ux*off, y:A.y+dy*u+uy*off});
    }
    snakePaths[h]=pts.map(p=>({x:p.x/10, y:p.y/10}));
    const [col,dark,spot]=SNAKE_COLORS[si%SNAKE_COLORS.length];
    const chunks=12, seg=N/chunks;
    const chunkPath=i=>{ const a=Math.floor(i*seg), b=Math.min(N,Math.floor((i+1)*seg)+1); return 'M'+pts.slice(a,b+1).map(p=>f1(p.x)+' '+f1(p.y)).join(' L'); };
    const wAt=i=>30-(i/chunks)*20;
    for(let i=0;i<chunks;i++) s+=`<path d="${chunkPath(i)}" stroke="${dark}" stroke-width="${f1(wAt(i)+6)}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
    for(let i=0;i<chunks;i++) s+=`<path d="${chunkPath(i)}" stroke="${col}" stroke-width="${f1(wAt(i))}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
    for(let i=0;i<chunks;i++) s+=`<path d="${chunkPath(i)}" stroke="${spot}" stroke-width="${f1(wAt(i)*.32)}" stroke-dasharray="4 14" stroke-linecap="round" fill="none" opacity=".9"/>`;
    // 머리
    const hd=pts[0], nx2=pts[3];
    const ang=Math.atan2(hd.y-nx2.y, hd.x-nx2.x)*180/Math.PI;
    s+=`<g transform="translate(${f1(hd.x)} ${f1(hd.y)}) rotate(${f1(ang)})">`+
       `<path d="M24 0 L40 0 M40 0 L47 -6 M40 0 L47 6" stroke="#E8232A" stroke-width="3.5" stroke-linecap="round" fill="none"/>`+
       `<ellipse cx="4" cy="0" rx="27" ry="22" fill="${col}" stroke="${dark}" stroke-width="4"/>`+
       `<circle cx="12" cy="-10" r="8" fill="#fff" stroke="${dark}" stroke-width="2"/><circle cx="14" cy="-9" r="4" fill="#222"/>`+
       `<circle cx="12" cy="10" r="8" fill="#fff" stroke="${dark}" stroke-width="2"/><circle cx="14" cy="11" r="4" fill="#222"/>`+
       `</g>`;
  });
  $('#overlay').innerHTML=s;
}

function animate(p, to, dur, arc){
  return new Promise(res=>{
    const from={...p.xy}, t0=performance.now();
    function f(now){
      const t=Math.min(1,(now-t0)/dur);
      const x=from.x+(to.x-from.x)*t, y=from.y+(to.y-from.y)*t - Math.sin(Math.PI*t)*arc;
      p.el.style.left=x+'%'; p.el.style.top=y+'%';
      if(t<1) requestAnimationFrame(f); else { p.xy={...to}; res(); }
    }
    requestAnimationFrame(f);
  });
}

// 경로를 따라 이동 (뱀)
function followPath(p, pts, dur){
  return new Promise(res=>{
    const L=[0]; for(let i=1;i<pts.length;i++) L.push(L[i-1]+Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y));
    const total=L[L.length-1], t0=performance.now();
    function f(now){
      const t=Math.min(1,(now-t0)/dur), d=t*total;
      let i=1; while(i<L.length-1 && L[i]<d) i++;
      const seg=(d-L[i-1])/((L[i]-L[i-1])||1);
      const x=pts[i-1].x+(pts[i].x-pts[i-1].x)*seg, y=pts[i-1].y+(pts[i].y-pts[i-1].y)*seg;
      p.el.style.left=x+'%'; p.el.style.top=y+'%';
      if(t<1) requestAnimationFrame(f); else { p.xy={x,y}; res(); }
    }
    requestAnimationFrame(f);
  });
}
// 사다리 오르기 (칸칸이 통통)
function climb(p, to){
  return new Promise(res=>{
    const from={...p.xy}, t0=performance.now(), dur=1100, steps=6;
    function f(now){
      const t=Math.min(1,(now-t0)/dur);
      const x=from.x+(to.x-from.x)*t, y=from.y+(to.y-from.y)*t - Math.abs(Math.sin(t*Math.PI*steps))*1.6;
      p.el.style.left=x+'%'; p.el.style.top=y+'%';
      if(t<1) requestAnimationFrame(f); else { p.xy={...to}; res(); }
    }
    requestAnimationFrame(f);
  });
}

async function rollMath(){
  const box=$('#diceShow'); $('#eqShow').innerHTML=''; $('#resultBlocks').innerHTML='';
  const r4=()=>1+Math.floor(Math.random()*4);
  for(let i=0;i<12;i++){

    sfx.tick(); await wait(65);

  const a=r4(), b=r4(), plus=Math.random()<.5;
  const o=plus?'+':'×', v=plus?a+b:a*b;
  box.innerHTML=dieHTML('d4',a)+`<div class="op ${plus?'plus':'times'}">${o}</div>`+dieHTML('d4',b);
  sfx.op();
  $('#eqShow').innerHTML=`${a} ${o} ${b} = <span class="ans">?</span>`;
  await wait(900);
  $('#eqShow').innerHTML=`${a} ${o} ${b} = <span class="ans">${v}</span>`;
  return v;
}
function showResultBlocks(v){
  const parts = v<=10 ? [v] : [10, v-10];
  $('#resultBlocks').innerHTML = parts.map((n,i)=>`<div class="rb" style="animation-delay:${i*.15}s">${nbSized(n,10)}</div>`).join(parts.length>1?'<span class="plus">+</span>':'');
}

/* ---------- 한 턴 ---------- */
async function takeTurn(kind){
  if(game.busy||game.over) return;
  ac(); game.busy=true; setBtns(false);
  const p=cur();
  const v = kind==='math' ? await rollMath() : await rollSingle(kind);
  showResultBlocks(v);
  if(p.pos+v<=100) msg(`${p.name}: <b>${v}칸</b> 앞으로 폴짝폴짝!`);
  await wait(450);
  await moveSteps(p, v);
  await settle(p);
  if(!game.over && p.el.isConnected) nextTurn();
}

async function moveSteps(p, steps){
  const target=p.pos+steps;
  if(target>100){
    // 100에 딱 맞아야 도착 → 넘치면 제자리
    const need=100-p.pos;
    toast(`딱 ${need}이 나와야 해요! 제자리 🙅`,'bump');
    msg(`${p.name}: ${steps}칸은 100을 넘어요. 딱 <b>${need}</b>이 나와야 도착해요!`);
    sfx.bump(); await wait(1200);
    return;
  }
  for(let i=p.pos+1;i<=target;i++) await hop(p, i);
}

// 사다리 / 뱀 / 겹침(+1칸) 처리를 반복
async function settle(p){
  for(let guard=0; guard<40; guard++){
    if(!p.el.isConnected) return; // 새 게임이 시작됨
    if(p.pos===100){ await finish(p); return; }
    if(LADDERS[p.pos]){
      const from=p.pos, to=LADDERS[from];
      toast(`🪜 사다리! ${from} → ${to}`,'good'); msg(`${p.name} 사다리 타고 ${from} → ${to} 올라가요!`);
      sfx.ladder(); await wait(350);
      p.pos=to; await climb(p, posXY(p)); await land(p); updateUI(); await wait(200);
      continue;
    }
    if(SNAKES[p.pos]){
      const from=p.pos, to=SNAKES[from];
      toast(`🐍 뱀이다! ${from} → ${to}`,'bad'); msg(`앗! ${p.name} 뱀 타고 ${from} → ${to} 내려가요`);
      sfx.snake(); await wait(350);
      p.pos=to; await followPath(p, snakePaths[from], 1300); setXY(p, posXY(p)); await land(p); updateUI(); await wait(200);
      continue;
    }
    const other=game.players.find(q=>q!==p && !q.done && q.pos===p.pos && q.pos>0);
    if(other){
      toast(`앗, ${other.name}랑 겹쳤어요! +1칸`,'bump'); msg(`${other.name} 자리라서 ${p.name} 한 칸 더 앞으로!`);
      sfx.bump(); await wait(500);
      await hop(p, p.pos+1);
      continue;
    }
    break;
  }
}

async function finish(p){
  p.done=true; p.rank=++game.rankCount;
  setXY(p, posXY(p)); p.el.classList.add('done'); p.el.classList.remove('active');
  sfx.win(); toast(`🏆 ${p.name} ${p.rank}등 도착!`,'win'); msg(`${p.name} ${p.rank}등으로 도착했어요! 🎉`);
  updateUI();
  await wait(1500);
  const left=game.players.filter(q=>!q.done);
  if(left.length<=1){
    left.forEach(q=>{ q.done=true; q.rank=++game.rankCount; });
    game.over=true; updateUI();
    await wait(400);
    endGame();
  } else {
    msg(`남은 사람들 계속 해요! ${left.map(q=>q.name).join(', ')} 화이팅!`);
  }
}

function nextTurn(){
  const n=game.players.length;
  let i=game.turn;
  for(let k=0;k<n;k++){ i=(i+1)%n; if(!game.players[i].done) break; }
  game.turn=i; game.busy=false; setBtns(true); updateUI();
}

/* ---------- 끝 ---------- */
function endGame(){
  const sorted=[...game.players].sort((a,b)=>a.rank-b.rank);
  const w=sorted[0];
  $('#winChar').innerHTML=nbSVG(w.ch, 190);
  $('#winName').innerHTML=w.name;
  $('#winName').style.color = w.ch===3 ? '#E0B400' : w.ch===10 ? '#E2231A' : nbColor(w.ch);
  $('#others').innerHTML=sorted.slice(1).map(q=>`<div class="orow"><span class="rkb">${q.rank}등</span>${nbSVG(q.ch,44)}<span>${q.name}</span></div>`).join('');
  const cf=$('#confetti'); cf.innerHTML='';
  const cols=['#E8232A','#F7931E','#F9D71C','#5DC232','#2BB5D8','#7D4CD6','#FF3EA5','#ffffff'];
  for(let i=0;i<90;i++){
    const c=document.createElement('i');
    c.style.left=Math.random()*100+'vw'; c.style.background=cols[i%cols.length];
    const d=2.5+Math.random()*3; c.style.animationDuration=d+'s'; c.style.animationDelay=(-Math.random()*d)+'s';
    cf.appendChild(c);
  }
  sfx.win();
  show('#endScreen');
  $('#game').classList.remove('hidden'); // 뒤에 보드가 보이게
}

$('#againBtn').onclick=()=>startGame();
$('#endHomeBtn').onclick=()=>{ $('#confetti').innerHTML=''; show('#scrCount'); };
$('#homeBtn').onclick=()=>{ if(confirm('처음 화면으로 갈까요? 지금 게임은 끝나요.')){ game.over=true; show('#scrCount'); } };
$('#muteBtn').onclick=()=>{ muted=!muted; $('#muteBtn').textContent = muted?'🔇 소리 끔':'🔊 소리'; };
</script>
