<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<title>혼자 치는 리치마작</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@900&family=Yuji+Syuku&display=swap">
<style>
/* Layout: 녹색 펠트 탁자(왼쪽, 상대 3명 위 · 정보 가운데 · 내 패 아래) + 오른쪽에 붙은 도움말 족보 */
:root{
  color-scheme:dark;
  --bg:#0b1f1a; --felt:#17574a; --felt-2:#0f4035; --rail:#3a2619;
  --panel:#112e27; --panel-2:#183b32; --line:rgba(243,239,226,.14);
  --ink:#f3efe2; --muted:#a8bdb3; --gold:#e6b23c; --red:#e2574c; --blue:#7fb2ff;
  --tile:#fefefb; --tile-2:#e8e8e0; --tile-back:#e8961c; --tile-back-2:#c47a0c;
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-tile:"Yuji Syuku","Noto Serif KR","Nanum Myeongjo","Batang",serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;letter-spacing:.02em;margin-right:auto}
.top h1 span{color:var(--gold)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:600}
.btn:hover{border-color:var(--gold)}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
@media (min-width:980px){.layout{grid-template-columns:minmax(0,1fr) 340px} #helpToggle,#helpClose{display:none}}

/* ---------- 탁자: 정사각 탁자에 네 사람이 둘러앉은 배치 ---------- */
#table{display:flex;flex-direction:column;gap:8px;min-width:0}
.strip{display:flex;align-items:center;justify-content:center;gap:6px 14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px}
.strip label{display:inline-flex;gap:5px;align-items:center;cursor:pointer;color:var(--muted);font-size:13px}
.chip{font-size:12px;border-radius:99px;padding:1px 8px;background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.warn{color:#fff;background:var(--red);border-color:var(--red)}
.chip.good{color:#10231d;background:var(--gold);border-color:var(--gold);font-weight:700}
.dora{display:flex;align-items:center;gap:6px;--w:27px}
.dora .lbl{font-size:12px;color:var(--muted)}
.dora .ts{display:flex;gap:1px}
#board{position:relative;container-type:inline-size;width:min(100%,max(320px,calc(100vh - 262px)));aspect-ratio:1;margin:0 auto;overflow:hidden;--cb:32cqw;
  background:radial-gradient(circle at 50% 50%,var(--felt),var(--felt-2));border:6px solid var(--rail);border-radius:20px;box-shadow:inset 0 0 50px rgba(0,0,0,.4)}
.seat{position:absolute;inset:0;pointer-events:none}
.seat .tile{pointer-events:auto}
#seat1{transform:rotate(-90deg)}#seat2{transform:rotate(180deg)}#seat3{transform:rotate(90deg)}
.seat .river{position:absolute;--w:4.6cqw;left:calc(50cqw - var(--w) * 3 - 3px);top:calc(50cqw + var(--cb) / 2 + 1cqw);display:flex;flex-direction:column;gap:.35cqw;align-items:flex-start}
.rrow{display:flex;gap:1px;align-items:flex-end}
.seat .ohand{position:absolute;left:0;right:0;bottom:1.4cqw;display:flex;justify-content:center;align-items:flex-end;gap:1px;--w:3.3cqw}
.seat .omelds{position:absolute;right:1.4cqw;bottom:1.4cqw;--w:3.9cqw;max-width:36cqw;flex-wrap:wrap-reverse;justify-content:flex-end;gap:.9cqw}
.melds{display:flex;gap:6px;align-items:flex-end}
.meld{display:flex;gap:1px;align-items:flex-end}
#cbox{position:absolute;left:calc(50cqw - var(--cb) / 2);top:calc(50cqw - var(--cb) / 2);width:var(--cb);height:var(--cb);background:rgba(6,22,18,.82);border:1px solid var(--line);border-radius:2.2cqw;
  display:grid;grid-template:"t t t" auto "l c r" 1fr "b b b" auto / 1fr 1.15fr 1fr;padding:.6cqw;gap:.3cqw;font-size:max(10px,2.4cqw);line-height:1.15}
.tag{display:flex;align-items:center;justify-content:center;gap:.35em;border-radius:1.2cqw;padding:.25em .3em;font-variant-numeric:tabular-nums;min-width:0}
.tag b{font-weight:700}.tag .nm{color:var(--muted);font-size:.86em}
.tag.col{flex-direction:column;gap:.15em}
.tag.turn{background:var(--gold);color:#1c1608}.tag.turn .nm{color:#4a3a10}
.tag .rstick{font-size:.8em;padding:0 .5em}
.wind{font-family:var(--f-tile);font-weight:900;width:1.65em;height:1.65em;border-radius:50%;display:inline-grid;place-items:center;
  background:var(--panel-2);border:1px solid var(--line);font-size:1em;flex:none;color:var(--ink)}
.wind.oya{background:var(--red);border-color:var(--red);color:#fff}
.rstick{background:var(--tile);color:#b3261e;border-radius:99px;font-size:11px;font-weight:700;padding:0 7px;white-space:nowrap}
.core{grid-area:c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2em;text-align:center}
.core .round{font-family:var(--f-display);font-size:1.75em;color:var(--gold);line-height:1;white-space:nowrap}
.core small{color:var(--muted);font-size:.85em;white-space:nowrap}.core small b{color:var(--ink);font-size:1.25em}
#subline{position:absolute;left:8.5cqw;bottom:1.6cqw;max-width:50%;z-index:4;display:flex;gap:5px 8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink);--w:22px}
#subline .txt{background:rgba(6,22,18,.75);border-radius:8px;padding:3px 8px}
#subline .ts{display:inline-flex;gap:1px;vertical-align:middle}
/* 치·퐁·깡·리치·론 버튼: 내 패의 오른쪽 위 */
#actions{position:absolute;right:1.6cqw;bottom:1.6cqw;z-index:6;display:flex;gap:10px;flex-wrap:wrap-reverse;justify-content:flex-end;align-items:flex-end;max-width:92%}
.act{font-family:var(--f-display);font-size:clamp(22px,4.6cqw,34px);letter-spacing:.06em;line-height:1;border:2px solid rgba(255,255,255,.55);border-radius:14px;padding:.42em .9em;min-width:3.6em;
  background:linear-gradient(#f4c758,#d99a1c);color:#1c1608;display:inline-flex;align-items:center;justify-content:center;gap:.3em;box-shadow:0 5px 0 rgba(0,0,0,.45),0 0 22px rgba(230,178,60,.45);--w:.95em;
  animation:actin .2s cubic-bezier(.2,1.5,.4,1) both}
.act.red{background:linear-gradient(#f0695d,#c2352b);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.45),0 0 22px rgba(226,87,76,.55)}
.act.blue{background:linear-gradient(#6fb0ff,#2f6fd0);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.45),0 0 22px rgba(111,176,255,.45)}
.act.green{background:linear-gradient(#5fd09a,#1f8f5c);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.45),0 0 22px rgba(95,208,154,.45)}
.act.ghost{background:rgba(10,30,25,.92);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.45)}
.act:active{transform:translateY(3px)}
@keyframes actin{from{transform:scale(.6);opacity:0}}
#handrow{container-type:inline-size;display:flex;align-items:flex-end;justify-content:center;gap:12px;--hw:min(56px,calc((100cqw - 24px) / var(--u,14.4)));min-height:calc(var(--hw) * 1.75)}
#hand{display:flex;align-items:flex-end;gap:1px;--w:var(--hw);padding-top:calc(var(--hw) * .3)}
#myMelds{--w:calc(var(--hw) * .78);gap:calc(var(--hw) * .2)}
#hand .tile{cursor:pointer;transition:transform .12s}
#hand .tile.drawn{margin-left:calc(var(--w) * .3)}
#hand .tile:hover,#hand .tile.sel{transform:translateY(-18%)}
#hand .tile.dim{filter:brightness(.55);cursor:default;transform:none}
#hand .tile.hint::after{content:"";position:absolute;left:50%;top:-22%;width:26%;aspect-ratio:1;border-radius:50%;background:var(--gold);transform:translateX(-50%);box-shadow:0 0 6px var(--gold)}
.say{position:absolute;transform:translate(-50%,-50%) scale(.6);font-family:var(--f-display);font-size:clamp(26px,7cqw,54px);line-height:1.1;color:#fff;
  background:var(--red);padding:.05em .5em;border-radius:.3em;opacity:0;pointer-events:none;z-index:7;white-space:nowrap;box-shadow:0 4px 18px rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.6)}
#say0{left:50%;top:80%}#say1{left:80%;top:50%}#say2{left:50%;top:20%}#say3{left:20%;top:50%}
.say.on{opacity:1;transform:translate(-50%,-50%) scale(1);transition:transform .18s cubic-bezier(.2,1.6,.4,1),opacity .1s}
.act.shine{position:relative;font-size:clamp(30px,6.4cqw,48px);padding:.4em 1.1em;border-color:#fff6c9;color:#fff;text-shadow:0 2px 0 #7a130d;
  background:linear-gradient(110deg,#b3261e 0%,#ef5a4d 30%,#fff1b8 50%,#ef5a4d 70%,#b3261e 100%);background-size:260% 100%;
  animation:actin .2s cubic-bezier(.2,1.5,.4,1) both,pulse .55s ease-in-out .2s infinite alternate,sweep 1.3s linear infinite}
.act.shine::before,.act.shine::after{content:"✦";position:absolute;color:#fff6c9;text-shadow:0 0 10px #ffd75e,0 0 20px #ffb400;font-size:.8em;animation:twinkle .8s ease-in-out infinite alternate;pointer-events:none}
.act.shine::before{left:-.35em;top:-.45em}.act.shine::after{right:-.3em;bottom:-.4em;animation-delay:.4s;font-size:.6em}
@keyframes pulse{from{transform:scale(1);box-shadow:0 5px 0 rgba(0,0,0,.45),0 0 14px 3px rgba(255,215,94,.65)}to{transform:scale(1.09);box-shadow:0 5px 0 rgba(0,0,0,.45),0 0 44px 14px rgba(255,215,94,1)}}
@keyframes sweep{from{background-position:130% 0}to{background-position:-130% 0}}
@keyframes twinkle{from{transform:scale(.3) rotate(0);opacity:.3}to{transform:scale(1.3) rotate(90deg);opacity:1}}
/* 론!/쯔모! 외침 말풍선 */
#banner{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:40;opacity:0;background:radial-gradient(circle,rgba(0,0,0,.05),rgba(0,0,0,.55))}
#banner svg{width:min(88vw,760px);height:auto;overflow:visible;filter:drop-shadow(0 14px 0 rgba(0,0,0,.45))}
#banner.on{opacity:1}#banner.on svg{animation:slam .95s cubic-bezier(.2,1.6,.35,1) both}
@keyframes slam{0%{transform:scale(.15) rotate(-14deg);opacity:0}22%{transform:scale(1.18) rotate(-5deg);opacity:1}30%{transform:scale(1) rotate(-5deg) translate(-10px,6px)}38%{transform:scale(1.04) rotate(-5deg) translate(10px,-6px)}46%{transform:scale(1) rotate(-5deg) translate(-7px,-4px)}54%{transform:scale(1.02) rotate(-5deg) translate(6px,4px)}62%,100%{transform:scale(1) rotate(-5deg)}}
/* 큰 역 예고: 별이 쏟아진다 */
#stars{position:fixed;inset:0;z-index:45;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,rgba(40,30,90,.75),rgba(3,6,20,.88));animation:fadein .35s both}
#stars.out{animation:fadeout .4s both}
#stars i{position:absolute;top:-12vh;font-style:normal;line-height:1;color:#ffd75e;text-shadow:0 0 8px #fff3b0,0 0 22px #ffb400;animation:fall linear both;will-change:transform}
#stars i::after{content:"";position:absolute;left:46%;bottom:60%;width:2px;height:9em;background:linear-gradient(to top,rgba(255,236,160,.75),transparent);transform:translateX(-50%) rotate(9deg);transform-origin:50% 100%}
#stars b{position:absolute;left:0;right:0;top:42%;text-align:center;font-family:var(--f-display);font-weight:400;font-size:clamp(28px,7vw,64px);color:#fff6c9;text-shadow:0 0 18px #ffb400,0 4px 0 #5c3a00;animation:omen 1.1s ease-in-out infinite alternate}
@keyframes fall{from{transform:translate3d(0,0,0)}to{transform:translate3d(var(--dx),128vh,0)}}
@keyframes fadein{from{opacity:0}}@keyframes fadeout{to{opacity:0}}
@keyframes omen{from{opacity:.55;letter-spacing:.1em}to{opacity:1;letter-spacing:.3em}}

/* ---------- 패 ---------- */
.tile{display:inline-block;position:relative;width:var(--w);aspect-ratio:3/4;flex:none;padding:0;border:0;
  background:linear-gradient(175deg,var(--tile),var(--tile-2));border-radius:10%/7.5%;
  box-shadow:0 calc(var(--w) * -.085) 0 var(--tile-back),0 calc(var(--w) * .1) calc(var(--w) * .1) rgba(0,0,0,.45),inset 0 0 0 1px rgba(40,40,30,.16)}
.tile svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tile.back{background:linear-gradient(175deg,var(--tile-back),var(--tile-back-2));box-shadow:0 calc(var(--w) * -.085) 0 var(--tile-back-2),0 calc(var(--w) * .1) calc(var(--w) * .1) rgba(0,0,0,.45)}
.tile.last{outline:2px solid var(--gold);outline-offset:1px;z-index:1}
.tile.win{outline:3px solid var(--red);outline-offset:1px}
.tile.tg{filter:brightness(.86)}
.tside{display:inline-block;position:relative;width:calc(var(--w) * 4 / 3);height:var(--w);flex:none}
.tside .tile{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg)}

/* ---------- 도움말 ---------- */
#help{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
@media (min-width:980px){#help{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}}
@media (max-width:979.98px){
  #help{position:fixed;z-index:30;top:0;right:0;bottom:0;width:min(360px,92vw);border-radius:14px 0 0 14px;overflow:auto;transform:translateX(105%);transition:transform .22s;
    padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-right:max(12px,env(safe-area-inset-right,0px));box-shadow:-10px 0 40px rgba(0,0,0,.5)}
  #help.open{transform:none}
}
.hhead{display:flex;align-items:center;gap:8px}
.hhead h2{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0;margin-right:auto}
#inspect{display:flex;gap:10px;align-items:center;background:var(--panel-2);border-radius:10px;padding:8px 10px;min-height:76px;--w:42px}
#inspect b{font-size:16px}#inspect p{margin:0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:9px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;border-radius:7px;padding:5px 0;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--gold);color:#1c1608}
.hsec h3{font-size:14px;margin:10px 0 2px;color:var(--gold)}
.hsec h3 small{color:var(--muted);font-weight:500;margin-left:6px}
.hsec p{margin:2px 0 6px;color:var(--muted);font-size:13px}
.trow{display:flex;gap:3px;flex-wrap:wrap;--w:30px}
.tcell{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ylist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ylist li{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line);container-type:inline-size}
.ylist li b{color:var(--gold)}.ylist li>span{color:var(--muted);font-size:12.5px}
.ex{display:flex;gap:1.6cqw;align-items:flex-end;padding-top:5px;--w:calc((100cqw - 8cqw) / 14.3)}
.ex .ts{display:flex;gap:0}
.ex .tile{box-shadow:0 calc(var(--w) * -.085) 0 var(--tile-back),inset 0 0 0 1px rgba(40,40,30,.3)}
.ylist li.h{border:0;padding:12px 0 2px;font-family:var(--f-display);font-size:17px;display:block}
.steps{margin:0;padding-left:18px;color:var(--muted);font-size:13px}.steps li{margin:4px 0}.steps b{color:var(--ink)}

/* ---------- 오버레이 ---------- */
#overlay{position:fixed;inset:0;z-index:50;background:rgba(4,14,11,.78);display:grid;place-items:center;overflow:auto;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scene{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(680px,100%);padding:18px;display:flex;flex-direction:column;gap:12px;container-type:inline-size;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.scene h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;line-height:1.1;text-wrap:balance}
.scene h2 em{font-style:normal;color:var(--gold)}
.scene .sub{color:var(--muted);margin:0}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}
.seg button{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left}
.seg button b{display:block;font-size:15px}.seg button span{color:var(--muted);font-size:12px}
.seg button[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.seg button[aria-pressed="true"] b{color:var(--gold)}
.field{display:flex;flex-direction:column;gap:5px}.field>label,.field>span{font-weight:700;font-size:13px;color:var(--muted)}
.go{font-family:var(--f-display);font-size:22px;border:0;border-radius:12px;padding:10px 20px;background:var(--gold);color:#1c1608;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.go.sec{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);font-size:16px}
.srow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.whand{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;--w:min(38px,calc((100cqw - 24px) / 15.2));background:radial-gradient(ellipse at center,var(--felt),var(--felt-2));border-radius:12px;padding:12px 8px;justify-content:center}
.whand .ts{display:flex;gap:1px;align-items:flex-end}
.wdora{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;--w:24px;align-items:center}
.wdora .ts{display:inline-flex;gap:1px;vertical-align:middle;margin-left:4px}
.yaku{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;min-height:40px}
.yaku li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--panel-2);border-radius:8px;padding:6px 12px;font-size:17px;font-weight:700;animation:pop .32s cubic-bezier(.2,1.5,.4,1) both}
.yaku li i{font-style:normal;color:var(--gold);font-variant-numeric:tabular-nums}
.yaku li.dora{background:transparent;border:1px dashed var(--line)}
@keyframes pop{from{transform:translateX(-24px) scale(.9);opacity:0}}
.total{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;justify-content:flex-end;min-height:48px}
.total .fh{font-size:17px;font-weight:700;color:var(--muted)}
.total .rank{font-family:var(--f-display);font-size:30px;color:var(--red);animation:pop .4s both}
.total .pts{font-family:var(--f-display);font-size:38px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
.deltas{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}
.deltas div{background:var(--panel-2);border-radius:8px;padding:6px 10px;font-variant-numeric:tabular-nums}
.deltas b{display:block}.deltas .up{color:var(--gold);font-weight:700}.deltas .dn{color:var(--red);font-weight:700}.deltas small{color:var(--muted)}
.tenpai{display:flex;flex-direction:column;gap:6px}
.tenpai .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;--w:min(24px,calc((100cqw - 110px) / 14))}
.tenpai .r b{width:92px}.tenpai .ts{display:flex;gap:1px}
.rankl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rankl li{display:flex;gap:12px;align-items:baseline;background:var(--panel-2);border-radius:10px;padding:8px 14px;font-size:17px;font-weight:700}

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
/* ================= 패 기본 ================= */
const NUM_HAN=['一','二','三','四','五','六','七','八','九'];
const HONOR_CH=['東','南','西','北','','發','中'];
const NUM_KO=['일','이','삼','사','오','육','칠','팔','구'];
const SUIT_KO=['만','통','삭'], HONOR_KO=['동','남','서','북','백','발','중'];
const K=id=>id>>2;
const isRed=id=>id===16||id===52||id===88;
const isHonor=k=>k>=27, isTerm=k=>k<27&&(k%9===0||k%9===8), isYao=k=>k>=27||k%9===0||k%9===8;
const YAO=[0,8,9,17,18,26,27,28,29,30,31,32,33], GREEN=new Set([19,20,21,23,25,32]);
const kname=k=>k<27?NUM_KO[k%9]+SUIT_KO[k/9|0]:HONOR_KO[k-27];
const kshort=k=>k<27?(k%9+1)+SUIT_KO[k/9|0]:HONOR_KO[k-27];
function kdesc(k,red){
  if(k<27){const s=k/9|0,n=k%9+1;
    const a=['만수(萬子) — 위의 한자가 숫자, 아래가 萬','통수(筒子) — 동그라미 개수가 숫자','삭수(索子) — 대나무 막대 개수가 숫자'][s];
    return a+(k===18?'. 1삭은 새 그림':'')+(n===1||n===9?' · 노두패(1·9)':' · 중장패(2~8)')+(red?' · 빨간 5는 그 자체로 도라 1판':'');}
  if(k<31) return '풍패(바람패). 자기 바람(자풍)이나 판의 바람(장풍)을 3장 모으면 역이 됩니다';
  return '삼원패. 같은 패 3장을 모으면 무조건 역(역패)이 됩니다'+(k===31?' · 백은 아무 그림 없는 흰 패':'');
}
const COL={r:'#c8281f',g:'#12703f',b:'#1c2c5e',k:'#15161c'};
const pin=(x,y,r,c)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><circle cx="${x}" cy="${y}" r="${r*.56}" fill="none" stroke="#fefefb" stroke-width="${r*.2}"/><circle cx="${x}" cy="${y}" r="${r*.2}" fill="#fefefb"/>`;
const stick=(x,y,h,c,a)=>`<g${a?` transform="rotate(${a} ${x} ${y})"`:''}><rect x="${x-3.5}" y="${y-h/2}" width="7" height="${h}" rx="3" fill="${c}"/><rect x="${x-4.8}" y="${y-1.3}" width="9.6" height="2.6" rx="1.2" fill="${c}"/><line x1="${x}" y1="${y-h/2+3}" x2="${x}" y2="${y+h/2-3}" stroke="#fefefb" stroke-width="1.1" opacity=".75"/></g>`;
const svgCache=new Map();
function tileSVG(k,red){
  const key=k+(red?'r':''); if(svgCache.has(key)) return svgCache.get(key);
  const {r,g,b,k:bk}=COL; let s='';
  const txt=(ch,y,size,c)=>`<text x="30" y="${y}" font-size="${size}" text-anchor="middle" fill="${c}" font-family="'Yuji Syuku','Noto Serif KR','Nanum Myeongjo',Batang,serif" font-weight="900">${ch}</text>`;
  if(k<9){ s=txt(NUM_HAN[k],33,29,red?r:bk)+txt('萬',70,31,r); }
  else if(k<18){ const n=k-9, c=x=>red?r:x;
    const L=[[[30,40,21,r]],[[30,21,13,b],[30,59,13,b]],[[15,17,10.5,b],[30,40,10.5,r],[45,63,10.5,g]],
      [[17,21,12,b],[43,21,12,b],[17,59,12,b],[43,59,12,b]],[[15,17,10,b],[45,17,10,b],[30,40,10,r],[15,63,10,b],[45,63,10,b]],
      [[17,15,10,g],[43,15,10,g],[17,43,10,r],[43,43,10,r],[17,65,10,r],[43,65,10,r]],
      [[12,11,7.6,g],[30,19,7.6,g],[48,27,7.6,g],[18,47,8.8,r],[42,47,8.8,r],[18,67,8.8,r],[42,67,8.8,r]],
      [[18,11,8.3,b],[42,11,8.3,b],[18,30.3,8.3,b],[42,30.3,8.3,b],[18,49.6,8.3,b],[42,49.6,8.3,b],[18,69,8.3,b],[42,69,8.3,b]],
      [[12,14,8.4,g],[30,14,8.4,g],[48,14,8.4,g],[12,40,8.4,r],[30,40,8.4,r],[48,40,8.4,r],[12,66,8.4,b],[30,66,8.4,b],[48,66,8.4,b]]][n];
    s=L.map(d=>pin(d[0],d[1],d[2],c(d[3]))).join('');
    if(n===0) s+=`<circle cx="30" cy="40" r="15.5" fill="none" stroke="${b}" stroke-width="3"/><circle cx="30" cy="40" r="5" fill="${g}"/>`;
  } else if(k<27){ const n=k-18, c=x=>red?r:x;
    if(n===0) s=`<path d="M30 58 L17 77 M30 58 L30 78 M30 58 L43 77" stroke="${r}" stroke-width="4.5" stroke-linecap="round"/><ellipse cx="29" cy="45" rx="13" ry="17" fill="${g}"/><path d="M19 42 q10 12 20 0" stroke="#fefefb" stroke-width="2.2" fill="none"/><path d="M21 50 q8 9 16 0" stroke="#fefefb" stroke-width="2" fill="none"/><circle cx="31" cy="21" r="10" fill="${g}"/><circle cx="34" cy="19" r="2.6" fill="#fefefb"/><circle cx="34.6" cy="19" r="1.1" fill="${bk}"/><path d="M40 19 l11 4 l-11 4z" fill="${r}"/><path d="M26 12 l-3 -8 M31 11 l0 -8 M36 12 l3 -8" stroke="${r}" stroke-width="2.4" stroke-linecap="round"/>`;
    else { const L=[null,[[30,21,28,g],[30,59,28,g]],[[30,21,28,g],[18,59,28,g],[42,59,28,g]],[[18,21,28,g],[42,21,28,g],[18,59,28,g],[42,59,28,g]],
      [[14,21,28,g],[46,21,28,g],[30,40,28,r],[14,59,28,g],[46,59,28,g]],[[14,21,28,g],[30,21,28,g],[46,21,28,g],[14,59,28,g],[30,59,28,g],[46,59,28,g]],
      [[30,14,21,r],[14,40,21,g],[30,40,21,g],[46,40,21,g],[14,66,21,g],[30,66,21,g],[46,66,21,g]],
      [[10,21,28,g],[23,21,28,g,-27],[37,21,28,g,27],[50,21,28,g],[10,59,28,g],[23,59,28,g,27],[37,59,28,g,-27],[50,59,28,g]],
      [[14,14,21,g],[30,14,21,r],[46,14,21,g],[14,40,21,g],[30,40,21,r],[46,40,21,g],[14,66,21,g],[30,66,21,r],[46,66,21,g]]][n];
      s=L.map(d=>stick(d[0],d[1],d[2],c(d[3]),d[4])).join(''); }
  } else if(k===31){ s=''; }
  else s=txt(HONOR_CH[k-27],57,45,k===32?g:k===33?r:bk);
  const out=`<svg viewBox="0 0 60 80" aria-hidden="true">${s}</svg>`; svgCache.set(key,out); return out;
}
function T(id,cls='',tag='span'){const k=K(id),rd=isRed(id);
  return `<${tag} class="tile ${cls}" data-k="${k}" data-id="${id}"${rd?' data-red="1"':''}${tag==='button'?' type="button" aria-label="'+kname(k)+'"':''}>${tileSVG(k,rd)}</${tag}>`;}
const TK=(k,cls='')=>`<span class="tile ${cls}" data-k="${k}">${tileSVG(k,false)}</span>`;
const BACK='<span class="tile back"></span>';
const side=h=>`<span class="tside">${h}</span>`;

/* ================= 샹텐 / 화료 판정 ================= */
const suitMemo=new Map();
function suitBest(a,off){
  let key=0; for(let i=0;i<9;i++) key=key*5+a[off+i];
  let res=suitMemo.get(key); if(res) return res;
  res=[-1,-1,-1,-1,-1]; const h=a.slice(off,off+9);
  (function rec(i,m,t){
    while(i<9&&h[i]===0) i++;
    if(i>=9){ if(m<5&&t>res[m]) res[m]=t; return; }
    if(h[i]>=3){h[i]-=3;rec(i,m+1,t);h[i]+=3;}
    if(i<7&&h[i+1]&&h[i+2]){h[i]--;h[i+1]--;h[i+2]--;rec(i,m+1,t);h[i]++;h[i+1]++;h[i+2]++;}
    if(h[i]>=2){h[i]-=2;rec(i,m,t+1);h[i]+=2;}
    if(i<8&&h[i+1]){h[i]--;h[i+1]--;rec(i,m,t+1);h[i]++;h[i+1]++;}
    if(i<7&&h[i+2]){h[i]--;h[i+2]--;rec(i,m,t+1);h[i]++;h[i+2]++;}
    const s=h[i];h[i]=0;rec(i+1,m,t);h[i]=s;
  })(0,0,0);
  if(suitMemo.size>300000) suitMemo.clear();
  suitMemo.set(key,res); return res;
}
function shantenN(c,nm){
  let best=8;
  const calc=head=>{
    let dp=[0,-1,-1,-1,-1];
    for(let s=0;s<3;s++){ const r=suitBest(c,s*9), nd=[-1,-1,-1,-1,-1];
      for(let a=0;a<5;a++) if(dp[a]>=0) for(let b=0;a+b<5;b++) if(r[b]>=0&&dp[a]+r[b]>nd[a+b]) nd[a+b]=dp[a]+r[b];
      dp=nd; }
    let hm=0,ht=0; for(let k=27;k<34;k++){ if(c[k]>=3) hm++; else if(c[k]===2) ht++; }
    for(let m=0;m<5;m++) if(dp[m]>=0){ const M=Math.min(4,m+hm+nm), t=Math.min(dp[m]+ht,4-M), s=8-2*M-t-head; if(s<best) best=s; }
  };
  calc(0);
  for(let k=0;k<34;k++) if(c[k]>=2){c[k]-=2;calc(1);c[k]+=2;}
  return best;
}
function shanten(c,nm){
  let s=shantenN(c,nm);
  if(nm===0){ let pairs=0,kinds=0,yk=0,yp=0;
    for(let k=0;k<34;k++) if(c[k]){kinds++; if(c[k]>=2) pairs++;}
    s=Math.min(s,6-pairs+Math.max(0,7-kinds));
    for(const k of YAO) if(c[k]){yk++; if(c[k]>=2) yp=1;}
    s=Math.min(s,13-yk-yp); }
  return s;
}
function waitsOf(c,nm){ const out=[]; if(shanten(c,nm)!==0) return out;
  for(let k=0;k<34;k++) if(c[k]<4){c[k]++; if(shanten(c,nm)===-1) out.push(k); c[k]--;} return out; }
function decompose(c){
  const out=[],h=c.slice();
  const rec=(i,hd,sets)=>{ while(i<34&&!h[i]) i++;
    if(i>=34){out.push({head:hd,sets:sets.slice()});return;}
    if(h[i]>=3){h[i]-=3;sets.push(['kou',i]);rec(i,hd,sets);sets.pop();h[i]+=3;}
    if(i<27&&i%9<7&&h[i+1]&&h[i+2]){h[i]--;h[i+1]--;h[i+2]--;sets.push(['shun',i]);rec(i,hd,sets);sets.pop();h[i]++;h[i+1]++;h[i+2]++;} };
  for(let hd=0;hd<34;hd++) if(h[hd]>=2){h[hd]-=2;rec(0,hd,[]);h[hd]+=2;}
  return out;
}
function basicPoints(han,fu){ if(han>=13) return 8000; if(han>=11) return 6000; if(han>=8) return 4000; if(han>=6) return 3000; if(han>=5) return 2000; return Math.min(2000,fu*Math.pow(2,han+2)); }
function rankName(r){ if(r.yakuman) return ['역만','더블 역만','트리플 역만','4배 역만','5배 역만','6배 역만'][Math.min(r.yakuman,6)-1];
  return r.han>=13?'헤아림 역만':r.han>=11?'삼배만':r.han>=8?'배만':r.han>=6?'하네만':r.basic>=2000?'만관':''; }

/* x: {c,melds,win,tsumo,riichi,ippatsu,haitei,houtei,rinshan,chankan,tenhou,chiihou,seat,round,dora,ura,aka} */
function evalHand(x){
  const {c,melds}=x, menzen=melds.every(m=>m.type==='ankan');
  const all=c.slice(); melds.forEach(m=>m.tiles.forEach(t=>all[K(t)]++));
  const kinds=[]; for(let k=0;k<34;k++) if(all[k]) kinds.push(k);
  const suits=new Set(kinds.filter(k=>k<27).map(k=>k/9|0)), hasHonor=kinds.some(isHonor);
  const common=[];
  if(x.riichi===2) common.push(['더블 리치',2]); else if(x.riichi) common.push(['리치',1]);
  if(x.riichi&&x.ippatsu) common.push(['일발',1]);
  if(menzen&&x.tsumo) common.push(['멘젠쯔모',1]);
  if(x.haitei) common.push(['해저로월',1]); if(x.houtei) common.push(['하저로어',1]);
  if(x.rinshan) common.push(['영상개화',1]); if(x.chankan) common.push(['창깡',1]);
  const tail=[];
  if(suits.size===1) tail.push(hasHonor?['혼일색',menzen?3:2]:['청일색',menzen?6:5]);
  const tanyao=kinds.every(k=>!isYao(k));
  const ykmCommon=[]; if(x.tenhou) ykmCommon.push('천화'); if(x.chiihou) ykmCommon.push('지화');
  if(kinds.every(isHonor)) ykmCommon.push('자일색');
  let best=null;
  const fin=(yaku,fu,ykm)=>{ let r;
    if(ykm.length) r={yaku:ykm.map(n=>[n,13]),yakuman:ykm.length,han:13*ykm.length,fu:0,basic:8000*ykm.length};
    else { const yh=yaku.reduce((s,y)=>s+y[1],0); if(!yh) return; const ys=yaku.slice();
      if(x.dora) ys.push(['도라',x.dora,1]); if(x.aka) ys.push(['적도라',x.aka,1]); if(x.ura) ys.push(['뒷도라',x.ura,1]);
      const han=ys.reduce((s,y)=>s+y[1],0); r={yaku:ys,yakuman:0,han,fu,basic:basicPoints(han,fu)}; }
    if(!best||r.basic>best.basic||(r.basic===best.basic&&r.han>best.han)) best=r; };
  // 국사무쌍
  if(!melds.length&&YAO.every(k=>c[k]>=1)&&YAO.reduce((s,k)=>s+c[k],0)===14) fin([],0,['국사무쌍'].concat(ykmCommon.filter(n=>n!=='자일색')));
  // 치또이쯔
  if(!melds.length&&kinds.length===7&&kinds.every(k=>c[k]===2)){
    const y=common.concat([['치또이쯔',2]]); if(tanyao) y.push(['탕야오',1]);
    if(kinds.every(isYao)) y.push(['혼노두',2]);
    fin(y.concat(tail),25,ykmCommon); }
  for(const d of decompose(c)){
    if(d.sets.length+melds.length!==4) continue;
    const base=d.sets.map(s=>({t:s[0],k:s[1],open:false,kan:false}));
    melds.forEach(m=>base.push(m.type==='chi'?{t:'shun',k:m.kind,open:true,kan:false}:{t:'kou',k:m.kind,open:m.type!=='ankan',kan:m.type!=='pon'}));
    const pl=[]; if(d.head===x.win) pl.push(-1);
    const seen=new Set();
    d.sets.forEach((s,i)=>{ const hit=s[0]==='kou'?s[1]===x.win:(x.win<27&&x.win>=s[1]&&x.win<=s[1]+2); const key=s[0]+s[1];
      if(hit&&!seen.has(key)){seen.add(key);pl.push(i);} });
    for(const pi of pl){
      const sets=base.map((s,i)=>(i===pi&&s.t==='kou'&&!x.tsumo)?Object.assign({},s,{open:true}):s);
      let waitFu=0,ryanmen=false;
      if(pi===-1) waitFu=2; else if(sets[pi].t==='shun'){ const s=sets[pi],n=s.k%9;
        if(x.win===s.k+1||(x.win===s.k&&n===6)||(x.win===s.k+2&&n===0)) waitFu=2; else ryanmen=true; }
      const shuns=sets.filter(s=>s.t==='shun'), kous=sets.filter(s=>s.t==='kou');
      const anko=kous.filter(s=>!s.open).length, kans=kous.filter(s=>s.kan).length;
      const dk=kous.filter(s=>s.k>=31).length, wk=kous.filter(s=>s.k>=27&&s.k<31).length;
      const ykm=ykmCommon.slice();
      if(anko===4) ykm.push('스안커'); if(dk===3) ykm.push('대삼원');
      if(wk===4) ykm.push('대사희'); else if(wk===3&&d.head>=27&&d.head<31) ykm.push('소사희');
      if(kinds.every(isTerm)) ykm.push('청노두'); if(kinds.every(k=>GREEN.has(k))) ykm.push('녹일색');
      if(kans===4) ykm.push('스깡쯔');
      if(!melds.length&&suits.size===1&&!hasHonor){ const o=kinds[0]-kinds[0]%9; let ok=c[o]>=3&&c[o+8]>=3; for(let i=1;i<8;i++) if(!c[o+i]) ok=false; if(ok) ykm.push('구련보등'); }
      const y=common.slice();
      const ykHead=d.head>=31||d.head===x.seat||d.head===x.round;
      const pinfu=menzen&&shuns.length===4&&!ykHead&&ryanmen;
      if(pinfu) y.push(['핑후',1]); if(tanyao) y.push(['탕야오',1]);
      if(menzen){ const cnt={}; shuns.forEach(s=>cnt[s.k]=(cnt[s.k]||0)+1); let pr=0; for(const k in cnt) pr+=cnt[k]>>1;
        if(pr===2) y.push(['량페코',3]); else if(pr===1) y.push(['이페코',1]); }
      for(const s of kous){ if(s.k>=31) y.push(['역패 '+HONOR_KO[s.k-27],1]); if(s.k===x.round) y.push(['장풍패 '+HONOR_KO[s.k-27],1]); if(s.k===x.seat) y.push(['자풍패 '+HONOR_KO[s.k-27],1]); }
      if(kous.length===4) y.push(['또이또이',2]);
      if(anko===3) y.push(['산안커',2]); if(kans===3) y.push(['산깡쯔',2]);
      for(let n=0;n<7;n++) if([0,9,18].every(o=>shuns.some(s=>s.k===o+n))){ y.push(['삼색동순',menzen?2:1]); break; }
      for(let n=0;n<9;n++) if([0,9,18].every(o=>kous.some(s=>s.k===o+n))){ y.push(['삼색동각',2]); break; }
      for(const o of [0,9,18]) if([0,3,6].every(n=>shuns.some(s=>s.k===o+n))){ y.push(['일기통관',menzen?2:1]); break; }
      const setYao=s=>s.t==='kou'?isYao(s.k):(s.k%9===0||s.k%9===6);

function humanTurn(p,drawn,rinshan){
  const c=counts(p),nm=p.melds.length,o={mode:'turn',drawn,tsumo:false,kans:[],riichiIds:null,hint:null};
  if(drawn!=null){
    if(shanten(c,nm)===-1&&evalFor(p,drawn,{tsumo:true,rinshan})) o.tsumo=true;
    if(G.kans<4&&G.live.length>0) o.kans=kanOptions(p,drawn);
    if(!p.riichi&&isMenzen(p)&&p.score>=1000&&G.live.length>=4){ const ids=riichiDiscards(p); if(ids.length) o.riichiIds=ids; }
  }
  if(p.riichi&&!o.tsumo&&!o.kans.length) return sleep(480).then(()=>({type:'discard',id:drawn}));
  if(G.opts.hints&&!p.riichi) o.hint=chooseDiscard(p,{level:1,noDefense:true}).id;
  return new Promise(res=>{ UI.pending=Object.assign(o,{resolve:res}); UI.riichiMode=false; UI.sel=null; render(); });
}
function humanCall(o){ return new Promise(res=>{ UI.pending=Object.assign(o,{mode:'call',resolve:res}); render(); }); }
function resolvePending(v){ const pd=UI.pending; if(!pd) return; UI.pending=null; UI.sel=null; UI.riichiMode=false; pd.resolve(v); }
function onHandClick(id){
  const pd=UI.pending; if(!pd||pd.mode!=='turn') return;
  if(UI.riichiMode){ if(!pd.riichiIds.includes(id)) return; }
  else if(me().riichi&&id!==pd.drawn) return;
  if(TOUCH&&UI.sel!==id){ UI.sel=id; render(); return; }
  resolvePending({type:'discard',id,riichi:UI.riichiMode});
}
function onAction(a,i){
  const pd=UI.pending; if(!pd) return;
  if(a==='tsumo') resolvePending({type:'tsumo'});
  else if(a==='kan') resolvePending(pd.kans[i]);
  else if(a==='riichi'){ UI.riichiMode=!UI.riichiMode; UI.sel=null; render(); }
  else if(a==='tsumogiri') resolvePending({type:'discard',id:pd.drawn});
  else if(a==='ron') resolvePending({type:'ron'});
  else if(a==='pon') resolvePending({type:'pon',tiles:pd.pon});
  else if(a==='minkan') resolvePending({type:'minkan',tiles:pd.kan});
  else if(a==='chi') resolvePending({type:'chi',tiles:pd.chi[i]});
  else if(a==='pass') resolvePending({type:'pass'});
}

function tone(f,d=.14,type='triangle',vol=.09,when=0){ if(!UI.sound||FAST) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+when;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.02);}catch(e){} }

function speak(text,cb){ try{ const u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=1.08; u.pitch=1.05; if(cb) u.onend=u.onerror=cb; speechSynthesis.speak(u); }catch(e){ if(cb) cb(); } }
function shout(i,text){ if(FAST) return; const el=$('#say'+i); el.textContent=text+'!'; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),1000);
  tone(660,.18,'sawtooth',.06); if(canSpeak()){ try{speechSynthesis.cancel();}catch(e){} speak(text); } }
/* 한 줄 읽어 주기: 읽기가 끝나고 최소 시간이 지나면 다음으로 */
function say(text,min=700){ return new Promise(res=>{ if(FAST||UI.skip) return res();
  let spoke=!canSpeak(); const t0=Date.now(); if(!spoke) speak(text,()=>{spoke=true;});
  const iv=setInterval(()=>{ const el=Date.now()-t0; if(UI.skip||(el>=min&&(spoke||el>2200))){ clearInterval(iv); res(); } },40); }); }
function burstPoints(){ let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647; return seed/2147483647;};
  const pts=[],N=26; for(let i=0;i<N*2;i++){ const a=Math.PI*2*i/(N*2)-Math.PI/2, out=i%2===0, r=out?.86+rnd()*.3:.6+rnd()*.07;
    pts.push((320+Math.cos(a)*300*r).toFixed(1)+','+(200+Math.sin(a)*170*r).toFixed(1)); } return pts.join(' '); }
async function banner(text,w,tsumo){ const b=$('#banner'), col=tsumo?'#1d4fc4':'#d3201a', dark=tsumo?'#0b1f5c':'#6a0c08', P=burstPoints();
  b.innerHTML=`<svg viewBox="-40 -40 720 480" role="img" aria-label="${text}"><polygon points="${P}" fill="${dark}" transform="translate(10 12)"/><polygon points="${P}" fill="#fff" stroke="${col}" stroke-width="12" stroke-linejoin="miter"/>
    <text x="320" y="${text.length>1?262:268}" text-anchor="middle" font-family="'Black Han Sans','IBM Plex Sans KR',sans-serif" font-size="${text.length>1?170:210}" fill="${col}" stroke="${dark}" stroke-width="7" paint-order="stroke" transform="skewX(-8)" style="letter-spacing:-4px">${text}!</text></svg>`;
  b.classList.add('on');
  tone(110,.5,'sawtooth',.1); tone(220,.45,'square',.07,.02); tone(440,.35,'sawtooth',.06,.06); if(canSpeak()){ try{speechSynthesis.cancel();}catch(e){} speak(text); }
  try{ await sleep(1500); } finally { b.classList.remove('on'); } }
/* 만관 이상이면 결과 전에 별이 쏟아져 큰 역을 예고한다 */
async function starFall(ev){
  const tier=ev.basic>=8000?5:ev.basic>=6000?4:ev.basic>=4000?3:ev.basic>=3000?2:1, n=[0,16,30,46,64,110][tier], dur=1500+tier*380;
  const el=document.createElement('div'); el.id='stars'; let h='';
  for(let i=0;i<n;i++){ const size=12+Math.random()*(18+tier*7), d=.9+Math.random()*1.1, delay=Math.random()*(dur/1000-.6);
    const hue=tier===5?`hsl(${Math.random()*360|0} 95% 72%)`:tier>=3&&Math.random()<.3?'#fff':'#ffd75e';
    h+=`<i style="left:${(Math.random()*104-2).toFixed(1)}%;font-size:${size.toFixed(0)}px;color:${hue};--dx:${(-8-Math.random()*16).toFixed(0)}vw;animation-duration:${d.toFixed(2)}s;animation-delay:${delay.toFixed(2)}s">★</i>`; }
  el.innerHTML=h+(tier>=3?`<b>${tier===5?'···!!!':'···!'}</b>`:''); document.body.appendChild(el);
  for(let i=0;i<6+tier*4;i++) tone(1200+Math.random()*1800,.25,'sine',.035,Math.random()*dur/1000);
  if(tier>=3) tone(65,dur/1000,'sawtooth',.05);
  try{ await sleep(dur); el.classList.add('out'); await sleep(380); } finally { el.remove(); }
}

  else h=`<div class="hsec"><h3>목표</h3><p>몸통 4개(3장씩) + 머리 1개(같은 패 2장)의 14장을 만들고, 역을 하나 이상 갖추면 화료입니다.</p>
    <h3>차례</h3><ol class="steps"><li>패를 한 장 뽑습니다(쯔모). 오른쪽에 떨어져 있는 패가 방금 뽑은 패입니다.</li><li>필요 없는 패를 눌러 한 장 버립니다.</li><li>남이 버린 패가 필요하면 버튼이 나타납니다.</li></ol>
    <h3>용어</h3><ol class="steps" style="list-style:none;padding:0">
    <li><b>슌쯔</b> 같은 종류 연속 3장 (3·4·5통)</li><li><b>커쯔</b> 같은 패 3장</li>
    <li><b>치</b> 왼쪽 사람(상가)이 버린 패로 슌쯔를 만듭니다</li><li><b>퐁</b> 누가 버렸든 그 패로 커쯔를 만듭니다</li><li><b>깡</b> 같은 패 4장. 패를 한 장 더 뽑고 도라가 늘어납니다</li>
    <li><b>멘젠</b> 치·퐁을 하지 않은 상태. 리치를 걸 수 있습니다</li><li><b>텐파이</b> 한 장만 더 오면 완성되는 상태</li><li><b>샹텐</b> 텐파이까지 남은 장수</li>
    <li><b>리치</b> 멘젠 텐파이에서 1,000점을 걸고 선언. 이후로는 뽑은 패만 버립니다</li><li><b>쯔모 / 론</b> 스스로 뽑아 완성 / 남의 버림패로 완성</li>
    <li><b>후리텐</b> 자기가 버린 패가 대기패에 있으면 론을 할 수 없습니다(쯔모는 가능)</li><li><b>친 / 자</b> 빨간 원이 친(선). 친은 점수를 1.5배로 주고받습니다</li>
    <li><b>부 · 판</b> 판은 역의 값, 부는 패 모양의 기본 점수. 둘을 곱해 점수가 정해집니다</li><li><b>유국</b> 아무도 화료하지 못한 판. 텐파이인 사람이 노텐인 사람에게 점수를 받습니다</li></ol></div>`;
  $('#helpBody').innerHTML=h;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===UI.tab));
}

/* ---------- 장면 ---------- */
const overlay=()=>$('#overlay');
function showScene(html){ const o=overlay(); o.innerHTML=html; o.hidden=false; o.scrollTop=0; return o; }
function waitBtn(sel){ const g=GEN; return new Promise((res,rej)=>{ $(sel).addEventListener('click',()=>g===GEN?res():rej(CANCEL),{once:true}); }); }
function deltasHTML(before,pay){ return `<div class="deltas">${G.P.map((q,i)=>`<div><b>${q.name}</b><small>${fmt(before[i])}</small> ${pay[i]?`<span class="${pay[i]>0?'up':'dn'}">${pay[i]>0?'+':'−'}${fmt(Math.abs(pay[i]))}</span>`:''}<br>${fmt(q.score)}</div>`).join('')}</div>`; }
const roundLabel=()=>`${HONOR_KO[G.round]}${G.kyoku+1}국 ${G.honba}본장`;
async function scoreScene({p,from,id,flags,ev,before,pay,ptsText,ptsSay,sticks}){
  UI.skip=false;
  const closed=p.hand.filter(t=>t!==id||!flags.tsumo).sort((a,b)=>a-b);
  if(flags.tsumo){ const dup=closed.length%3===2; if(dup) closed.splice(closed.indexOf(id),1); }
  const ura=p.riichi?`<span>뒷도라 표시패<span class="ts">${G.ura.slice(0,G.doraN).map(t=>T(t)).join('')}</span></span>`:'';
  showScene(`<div class="scene">
    <h2><em>${flags.tsumo?'쯔모':'론'}</em> ${p.name}의 화료</h2>
    <p class="sub">${roundLabel()} · ${p.idx===G.dealer?'친':'자'}${from>=0?` · 방총 ${G.P[from].name}`:''}</p>
    <div class="whand"><span class="ts">${closed.map(t=>T(t)).join('')}</span><span class="ts">${T(id,'win')}</span>${p.melds.map(m=>meldHTML(m,p.idx)).join('')}</div>
    <div class="wdora"><span>도라 표시패<span class="ts">${G.dora.slice(0,G.doraN).map(t=>T(t)).join('')}</span></span>${ura}</div>
    <ul class="yaku" id="yakuList"></ul>
    <div class="total" id="total"></div>
    <div id="deltaBox"></div>
    <div class="srow"><button class="go sec" id="skipBtn" type="button">건너뛰기</button><button class="go" id="nextBtn" type="button" hidden>다음</button></div></div>`);
  $('#skipBtn').addEventListener('click',()=>{ UI.skip=true; try{speechSynthesis.cancel();}catch(e){} });
  await say('',350);
  const list=$('#yakuList'); let n=0;
  for(const y of ev.yaku){
    const li=document.createElement('li'); if(y[2]) li.className='dora';
    li.innerHTML=`<span>${y[0]}${y[2]?' '+y[1]:''}</span><i>${ev.yakuman?'역만':y[1]+'판'}</i>`; list.appendChild(li);
    tone(440*Math.pow(1.122,n++),.2); li.scrollIntoView({block:'nearest'});
    await say(y[2]?`${y[0]} ${y[1]}`:y[0],720);
  }
  const tot=$('#total'), rk=rankName(ev);
  const fh=ev.yakuman?'':`${ev.fu}부 ${ev.han}판`;
  if(fh){ tot.innerHTML=`<span class="fh">${fh}</span>`; tone(520,.2); await say(fh,650); }
  if(rk){ tot.insertAdjacentHTML('beforeend',`<span class="rank">${rk}</span>`); tone(330,.5,'sawtooth',.08); tone(660,.5,'sawtooth',.05,.04); await say(rk,750); }
  tot.insertAdjacentHTML('beforeend',`<span class="pts">${ptsText}</span>`);
  [523,659,784,1047].forEach((f,i)=>tone(f,.35,'triangle',.08,i*.07));
  await say(ptsSay,800);
  $('#deltaBox').innerHTML=((G.honba||sticks)?`<p class="sub" style="margin-bottom:6px">${G.honba?`본장 ${G.honba}개 +${G.honba*300}점`:''}${G.honba&&sticks?' · ':''}${sticks?`공탁 리치봉 ${sticks}개 +${fmt(sticks*1000)}점`:''}</p>`:'')+deltasHTML(before,pay);
  $('#skipBtn').hidden=true; const nb=$('#nextBtn'); nb.hidden=false; nb.focus(); nb.scrollIntoView({block:'nearest'});
  await waitBtn('#nextBtn'); overlay().hidden=true;
}
async function drawScene(ten,before,pay){
  shoutCenter('유국');
  showScene(`<div class="scene"><h2><em>유국</em> 아무도 화료하지 못했습니다</h2><p class="sub">${roundLabel()} · 텐파이인 사람이 노텐인 사람에게 합계 3,000점을 받습니다</p>
    <div class="tenpai">${G.P.map(q=>`<div class="r"><b>${q.name} <span class="chip ${ten.includes(q)?'good':''}">${ten.includes(q)?'텐파이':'노텐'}</span></b>${ten.includes(q)?`<span class="ts">${q.hand.map(t=>T(t)).join('')}</span>`:''}</div>`).join('')}</div>
    ${deltasHTML(before,pay)}<div class="srow"><button class="go" id="nextBtn" type="button">다음</button></div></div>`);
  $('#nextBtn').focus(); await waitBtn('#nextBtn'); overlay().hidden=true;
}
function shoutCenter(t){ tone(260,.4,'sine',.08); if(canSpeak()) speak(t); }
async function finalScene(){
  const rank=G.P.slice().sort((a,b)=>b.score-a.score||a.idx-b.idx), my=rank.indexOf(me())+1;
  showScene(`<div class="scene"><h2><em>대국 종료</em> ${my}위로 마쳤습니다</h2><p class="sub">${['쉬움','보통','어려움'][G.opts.level]} · ${G.opts.rounds===1?'동풍전':'반장전'}</p>
    <ol class="rankl">${rank.map((q,i)=>`<li class="${q.human?'me':''}"><i>${i+1}위</i>${q.name}<span>${fmt(q.score)}점</span></li>`).join('')}</ol>
    <div class="srow"><button class="go" id="nextBtn" type="button">새 게임</button></div></div>`);
  [523,659,784,1047,1319].forEach((f,i)=>tone(f,.4,'triangle',.08,i*.1));
  await waitBtn('#nextBtn'); startScene();
}
const LEVELS=[['쉬움','상대가 가끔 엉뚱한 패를 버리고 수비를 하지 않습니다'],['보통','패 효율을 따지고 리치를 겁니다'],['어려움','리치에 안전패로 수비하고 울기도 적극적입니다']];
function startScene(first){
  ++GEN; UI.pending=null;
  if(first){ newGame(); initHand(); G.turn=-1; render(); }
  const seg=(name,items,val)=>`<div class="seg" data-seg="${name}">${items.map((it,i)=>`<button type="button" data-v="${it[2]??i}" aria-pressed="${(it[2]??i)===val}"><b>${it[0]}</b><span>${it[1]}</span></button>`).join('')}</div>`;
  showScene(`<div class="scene"><h2>혼자 치는 <em>리치마작</em></h2><p class="sub">컴퓨터 세 명과 치는 4인 리치마작입니다. 적도라 3장, 쿠이탕 있음, 25,000점 시작.</p>
    <div class="field"><span>난이도</span>${seg('level',LEVELS,G.opts.level)}</div>
    <div class="field"><span>길이</span>${seg('rounds',[['동풍전','동 1국~4국. 15분 안팎',1],['반장전','동·남 8국. 30분 안팎',2]],G.opts.rounds)}</div>
    <div class="field"><span>도우미</span>${seg('hints',[['힌트 켬','추천 버림패와 샹텐 수를 보여 줍니다',1],['힌트 끔','스스로 판단합니다',0]],G.opts.hints?1:0)}</div>
    <div class="srow"><button class="go" id="startBtn" type="button">대국 시작</button></div></div>`);
  overlay().querySelectorAll('.seg').forEach(s=>s.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
    const v=+b.dataset.v, n=s.dataset.seg; G.opts[n]=n==='hints'?!!v:v; s.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); }));
  $('#startBtn').addEventListener('click',()=>{ try{localStorage.setItem('mj-opts',JSON.stringify(G.opts));}catch(e){}
    overlay().hidden=true; tone(523,.2); newGame(); runGame(); });
}

/* ================= 이벤트 ================= */
$('#hand').addEventListener('click',e=>{ const t=e.target.closest('.tile'); if(t) onHandClick(+t.dataset.id); });
$('#actions').addEventListener('click',e=>{ const b=e.target.closest('.act'); if(b) onAction(b.dataset.a,+b.dataset.i||0); });
$('#center').addEventListener('change',e=>{ if(e.target.id==='callsOff') UI.callsOff=e.target.checked; });
const onTile=e=>{ const t=e.target.closest&&e.target.closest('.tile[data-k]'); if(t) inspect(+t.dataset.k,!!t.dataset.red); };
document.addEventListener('mouseover',onTile); document.addEventListener('click',onTile);
document.querySelector('.tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ UI.tab=b.dataset.tab; renderHelp(); } });
$('#helpToggle').addEventListener('click',()=>$('#help').classList.toggle('open'));
$('#helpClose').addEventListener('click',()=>$('#help').classList.remove('open'));
$('#soundBtn').addEventListener('click',e=>{ UI.sound=!UI.sound; e.target.textContent=UI.sound?'소리 켬':'소리 끔'; if(!UI.sound){ try{speechSynthesis.cancel();}catch(x){} } });
$('#newBtn').addEventListener('click',()=>startScene(false));
try{ const o=JSON.parse(localStorage.getItem('mj-opts')||'null'); if(o) Object.assign(G.opts,{level:[0,1,2].includes(o.level)?o.level:1,rounds:o.rounds===2?2:1,hints:!!o.hints}); }catch(e){}
inspect(null); renderHelp(); startScene(true);
window.MJ={G,UI,STATS,banner,starFall,evalHand,shanten,waitsOf,runGame,newGame,render,scoreScene,initHand,K,
  set fast(v){FAST=v;},set auto(v){AUTO=v;}};
})();
</script>
