<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>넘버블럭스 스케이트 14</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen canvas game, DOM overlays for HUD, controls and menus. Single bright playground look. */
:root{
  --ink:#2b2b40; --ink2:#5a5d78; --paper:#ffffff; --sky:#8fd3ff;
  --green:#3dbb3d; --red:#e8262b; --orange:#ff8a00; --gold:#ffc62e; --blue:#2f8cff; --purple:#8b3fc6;
  --dim:rgba(30,34,60,.55);
  --font:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--font);
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
.round{width:44px;height:44px;border-radius:14px;background:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.18);font-size:18px}
.hstage{font-size:16px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hright{display:flex;gap:6px;align-items:center}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:5px 11px;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.15);display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ci{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#ffc62e 45%,#e09400);box-shadow:inset 0 0 0 2px #d08400}
.hearts{color:var(--red);letter-spacing:-1px}
.prog{grid-column:1/-1;height:8px;background:rgba(255,255,255,.55);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--orange));border-radius:99px}

/* Controls */
.ctl{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;gap:8px;
  padding:0 max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(10px,env(safe-area-inset-left,0px))}
#ctl{grid-template-columns:1fr 1.15fr 1.15fr 1fr}
#twinCtl{grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
#twinCtl .cb:nth-child(3){margin-left:8px}
.cb{height:74px;border-radius:22px;background:rgba(255,255,255,.88);box-shadow:0 6px 0 rgba(0,0,0,.2);font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cb small{font-size:13px;margin-top:4px;color:var(--ink2)}
.cb:active,.cb.on{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2);background:#fff}
.cb.jump{background:rgba(255,236,170,.95)}
.cb.duck{background:rgba(200,232,255,.95)}
.cb.pulse{animation:pulse .8s ease-in-out infinite;background:#fff59d}
.cb.seven{font-size:28px}
.cb.seven small{font-size:11px;white-space:nowrap}
.cb.seven[data-twin="0"]{background:rgba(226,204,252,.95)}
.cb.seven[data-twin="1"]{background:rgba(196,232,255,.95)}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 6px 0 rgba(0,0,0,.2),0 0 0 0 rgba(255,198,46,.9)}50%{transform:scale(1.07);box-shadow:0 6px 0 rgba(0,0,0,.2),0 0 0 10px rgba(255,198,46,0)}}

/* Hint */
#hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translateX(-50%);width:min(92vw,460px);z-index:6;
  background:var(--paper);border-radius:24px;padding:14px 16px;box-shadow:0 8px 0 rgba(0,0,0,.12),0 18px 40px rgba(0,0,0,.25);
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;animation:pop .3s ease-out}
#hintIcon{font-size:40px;line-height:1;animation:bounce 1s ease-in-out infinite}
#hint p{margin:0;font-size:19px;line-height:1.4;text-wrap:balance}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* Screens */
.screen{position:fixed;inset:0;z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;align-items:center;gap:14px}
.screen.dim{background:var(--dim);justify-content:center}
.panel{background:var(--paper);border-radius:28px;padding:18px;box-shadow:0 8px 0 rgba(0,0,0,.1),0 20px 40px rgba(0,0,0,.2);width:100%;max-width:520px;text-align:center}
.panel h2{margin:2px 0 10px;font-weight:normal;font-size:28px}
.btn{font-size:21px;padding:13px 24px;border-radius:999px;color:#fff;background:var(--blue);box-shadow:0 5px 0 rgba(0,0,0,.22);min-height:52px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.btn.go{background:var(--green)}.btn.warm{background:var(--orange)}.btn.pink{background:#ef4f8b}.btn.grey{background:#8d90a6}.btn.red{background:var(--red)}
.btn[disabled]{background:#c4c6d3;box-shadow:none;cursor:default}
.col{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.topbar{width:100%;max-width:820px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.topbar h2{margin:0;font-weight:normal;font-size:26px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.backbtn{font-size:18px;padding:9px 16px;border-radius:999px;background:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.18)}

/* Menu */
#menu{justify-content:center;background:linear-gradient(rgba(143,211,255,.0),rgba(143,211,255,.0))}
.logo{margin:0;text-align:center;line-height:1.05;font-weight:normal}
.logo .l1{display:block;font-size:clamp(30px,9vw,54px);color:#fff;-webkit-text-stroke:2px rgba(0,0,0,.18);text-shadow:0 4px 0 rgba(0,0,0,.18)}
.logo .l1 span{display:inline-block;animation:tbob 1.6s ease-in-out infinite}
.logo .l2{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:clamp(22px,6vw,34px);color:#fff;background:var(--green);padding:4px 18px;border-radius:999px;box-shadow:0 5px 0 #23862a}
@keyframes tbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.hero14{height:min(24vh,210px);filter:drop-shadow(0 8px 6px rgba(0,0,0,.2));animation:hero 1.2s ease-in-out infinite alternate}
@keyframes hero{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-10px) rotate(3deg)}}
.coinbar{display:flex;gap:8px;align-items:center;font-size:20px}

/* Map */
.zone{width:100%;max-width:820px;background:rgba(255,255,255,.9);border-radius:24px;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.1)}
.zone h3{margin:0 0 10px;font-weight:normal;font-size:21px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.zone h3 small{font-size:14px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.st{aspect-ratio:1;max-width:100%;border-radius:16px;font-size:21px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 4px 0 rgba(0,0,0,.18);background:#fff;padding:0}
.st .s{font-size:11px;letter-spacing:-1px;color:#e0a000;min-height:12px}
.st.tut{background:#fff4c2}
.st.cur{background:var(--gold);animation:pulse 1.2s ease-in-out infinite}
.st.done{background:#d8f5cf}
.st[disabled]{background:#e3e4ea;color:#a3a6b8;box-shadow:none}

/* Shop */
.tabs{display:flex;gap:8px;width:100%;max-width:820px}
.tab{flex:1;font-size:18px;padding:10px;border-radius:16px;background:rgba(255,255,255,.7);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.tab.on{background:#fff;color:var(--blue)}
.items{width:100%;max-width:820px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{background:#fff;border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 rgba(0,0,0,.1);min-width:0}
.item canvas,.item img{width:100%;max-width:120px;height:110px;object-fit:contain}
.item .nm{font-size:16px;text-align:center}
.item button{width:100%;font-size:16px;padding:9px 6px;border-radius:999px;color:#fff;background:var(--orange);box-shadow:0 4px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;gap:5px}
.item button.own{background:var(--blue)}
.item button.eq{background:var(--green)}
.item button[disabled]{background:#c4c6d3;box-shadow:none}
.item.locked img{filter:grayscale(.2) brightness(.95)}

/* Settings + result */
.seg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.seg button{font-size:18px;padding:10px 16px;border-radius:999px;background:#eef0f7;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.seg button.on{background:var(--green);color:#fff}
.note{font-size:15px;color:var(--ink2);margin:6px 0 0;line-height:1.45}
.stars{font-size:52px;letter-spacing:4px;color:#d9dbe6;line-height:1.1}
.stars b{color:var(--gold);font-weight:normal;display:inline-block;animation:starpop .5s ease-out both}
.stars b:nth-child(2){animation-delay:.25s}.stars b:nth-child(3){animation-delay:.5s}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
.judges{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.judges div{border-radius:14px;padding:6px 2px;font-size:14px;background:#f2f3f8}
.judges b{display:block;font-size:22px;font-weight:normal;font-variant-numeric:tabular-nums}
.jp{color:#e09400}.jg{color:#22a650}.jn{color:#2f8cff}.jb{color:#8d90a6}
.earn{font-size:22px;display:flex;justify-content:center;align-items:center;gap:8px;margin:6px 0}
.earn small{font-size:14px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:17px;z-index:20;animation:fade 1.8s forwards;white-space:nowrap}
@keyframes fade{0%{opacity:0;transform:translate(-50%,10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.logo .l1 span,.hero14,.st.cur,#hintIcon{animation:none}}
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="hud" hidden>
  <button class="round" id="btnPause" aria-label="일시정지">❚❚</button>
  <div class="hstage" id="hStage"></div>
  <div class="hright"><span class="pill hearts" id="hHearts"></span><span class="pill"><i class="ci"></i><b id="hCoins">0</b></span></div>
  <div class="prog"><i id="hProg"></i></div>
</div>

<div id="ctl" class="ctl" hidden>
  <button class="cb" data-act="left" aria-label="왼쪽">◀<small>왼쪽</small></button>
  <button class="cb duck" data-act="duck" aria-label="숙이기">▼<small>숙이기</small></button>
  <button class="cb jump" data-act="jump" aria-label="점프">▲<small>점프</small></button>
  <button class="cb" data-act="right" aria-label="오른쪽">▶<small>오른쪽</small></button>
</div>
<div id="twinCtl" class="ctl" hidden>
  <button class="cb seven" data-twin="0" data-a="jump" aria-label="왼쪽 7 점프">▲<small>왼쪽 7 점프</small></button>
  <button class="cb seven" data-twin="0" data-a="duck" aria-label="왼쪽 7 숙이기">▼<small>왼쪽 7 숙이기</small></button>
  <button class="cb seven" data-twin="1" data-a="duck" aria-label="오른쪽 7 숙이기">▼<small>오른쪽 7 숙이기</small></button>
  <button class="cb seven" data-twin="1" data-a="jump" aria-label="오른쪽 7 점프">▲<small>오른쪽 7 점프</small></button>
</div>

<div id="hint" hidden>
  <div id="hintIcon"></div>
  <p id="hintText"></p>
  <button class="btn go" id="hintOk">알겠어요!</button>
</div>

<section id="menu" class="screen">
  <h1 class="logo"><span class="l1" id="logoTxt"></span><span class="l2"><i class="ci"></i> 스케이트 14</span></h1>
  <img class="hero14" id="hero14" alt="14">
  <div class="coinbar pill"><i class="ci"></i><b id="mCoins">0</b></div>
  <div class="col">
    <button class="btn go" id="btnPlay">▶ 이어하기</button>
    <button class="btn" id="btnMap">스테이지 고르기</button>
    <button class="btn warm" id="btnShop">상점</button>
    <button class="btn grey" id="btnSet">설정</button>
  </div>
</section>

<section id="map" class="screen" hidden>
  <div class="topbar"><button class="backbtn" data-back>◀ 처음으로</button><h2>스테이지</h2><span class="pill"><i class="ci"></i><b class="coinOut">0</b></span></div>
  <div id="mapZones" style="display:flex;flex-direction:column;gap:14px;width:100%;align-items:center"></div>
</section>

<section id="shop" class="screen" hidden>
  <div class="topbar"><button class="backbtn" data-back>◀ 처음으로</button><h2>상점</h2><span class="pill"><i class="ci"></i><b class="coinOut">0</b></span></div>
  <div class="tabs">
    <button class="tab on" data-tab="sticker">스티커</button>
    <button class="tab" data-tab="skin">색깔</button>
    <button class="tab" data-tab="board">보드</button>
  </div>
  <div class="items" id="items"></div>
</section>

<section id="settings" class="screen dim" hidden>
  <div class="panel">
    <h2>설정</h2>
    <p class="note" style="margin:0 0 6px">난이도</p>
    <div class="seg" id="segDiff"></div>
    <p class="note" id="diffNote"></p>
    <p class="note" style="margin:16px 0 6px">소리</p>
    <div class="seg" id="segSound"><button data-v="1">켜기</button><button data-v="0">끄기</button></div>
    <p class="note" style="margin:16px 0 6px">기록</p>
    <div class="seg"><button id="btnReset">처음부터 다시 하기</button></div>
    <p class="note" id="resetNote"></p>
    <div style="margin-top:16px"><button class="btn go" data-back>확인</button></div>
  </div>
</section>

<section id="pause" class="screen dim" hidden>
  <div class="panel">
    <h2>잠깐 쉬어요</h2>
    <div class="col" style="margin:0 auto">
      <button class="btn go" id="btnResume">계속하기</button>
      <button class="btn warm" id="btnRestart">처음부터 다시</button>
      <button class="btn grey" id="btnQuit">스테이지 지도로</button>
    </div>
  </div>
</section>

<section id="result" class="screen dim" hidden>
  <div class="panel" id="resPanel"></div>
</section>

function poly(pts, fill) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }
function box3d(x0, x1, y0, y1, z0, z1, cf, ct, cs) {
  z0 = Math.max(z0, camZ + 0.4); if (z1 <= z0) return null;
  const a = P3(x0, y0, z0), b = P3(x1, y0, z0), c = P3(x1, y1, z0), d = P3(x0, y1, z0);
  const e = P3(x0, y1, z1), f = P3(x1, y1, z1), g = P3(x0, y0, z1), h = P3(x1, y0, z1);
  if (camX < x0) poly([a, d, e, g], cs);
  if (camX > x1) poly([b, c, f, h], cs);
  if (camY > y1) poly([d, c, f, e], ct);
  poly([a, b, c, d], cf);
  return { x: a[0], y: d[1], w: b[0] - a[0], h: a[1] - d[1], s: a[2] };
}
function local(x, y, z, fn) { const p = P3(x, y, z); ctx.save(); ctx.translate(p[0], p[1]); ctx.scale(p[2], p[2]); fn(p[2]); ctx.restore(); }
function circ(x, y, r, col) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill(); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function shadow(x, z, r = 0.35, a = 0.2) { const p = P3(x, 0.01, z); ctx.fillStyle = `rgba(0,0,0,${a})`; ctx.beginPath(); ctx.ellipse(p[0], p[1], r * p[2], r * p[2] * 0.28, 0, 0, Math.PI * 2); ctx.fill(); }

// ============================================================ effects
function popText(txt, color, yFrac = 0.3, life = 1, size = 40, sub = '') { G.texts.push({ txt, color, y: yFrac, t: 0, life, size, sub }); }
function burst(x, y, n, cols, spd = 260, size = 6, grav = 500) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (0.4 + Math.random() * 0.8);
    G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.3, life: 0.6 + Math.random() * 0.6, t: 0, col: pick(cols, Math.random()), size: size * (0.6 + Math.random() * 0.8), grav, kind: 'dot' });
  }
}
function confetti(n = 80) {
  for (let i = 0; i < n; i++) G.parts.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.4, vx: (Math.random() - 0.5) * 80, vy: 80 + Math.random() * 120, life: 3 + Math.random() * 1.5, t: 0, col: pick(RAINBOW, Math.random()), size: 6 + Math.random() * 6, grav: 30, kind: 'conf', rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10 });
}
function emoji(x, y, ch, n = 1) { for (let i = 0; i < n; i++) G.parts.push({ x: x + (Math.random() - 0.5) * 30, y, vx: (Math.random() - 0.5) * 40, vy: -90 - Math.random() * 60, life: 1.3, t: 0, col: '', size: 22 + Math.random() * 8, grav: 0, kind: 'emoji', ch }); }

// ============================================================ input
function act(a) {
  if (G.scene !== 'play' || G.paused) return;
  const h = G.hint;
  if (h) {
    if (h.need === 'lane' && (a === 'left' || a === 'right')) {
      doAct(a); if (P.lane === h.lane) resolveHint(); return;
    }
    if (h.need === a) { resolveHint(); doAct(a); }
    return;
  }
  if (G.rt - G.startT < 1.2) return;
  if (P.mode === 'grind') { mashTap(); return; }
  if (P.mode === 'twin') { if (a === 'left') twinJump(0); else if (a === 'right') twinJump(1); else if (a === 'duck') { twinDuck(0); twinDuck(1); } else { twinJump(0); twinJump(1); } return; }
  doAct(a);
}
function doAct(a) {
  if (P.mode !== 'ride') return;
  if (a === 'left' && P.lane > -1) { P.lane--; SFX.swish(); }
  else if (a === 'right' && P.lane < 1) { P.lane++; SFX.swish(); }
  else if (a === 'jump' && !P.air) { P.air = true; P.vy = JUMPV; P.duck = 0; SFX.jump(); }
  else if (a === 'jump' && P.air) P.jbuf = G.rt;
  else if (a === 'duck') { if (P.air) P.vy = Math.min(P.vy, -12); P.duck = DUCK_T; SFX.duck(); }
}
let swipe = null;
cv.addEventListener('pointerdown', e => {
  audioInit();
  if (G.scene !== 'play' || G.paused) return;
  const x = e.clientX, y = e.clientY;
  if (G.hint) {
    if (G.hint.need === 'tap' || G.hint.need === 'msg') { resolveHint(); return; }
    swipe = { x, y, done: false }; return;
  }
  if (G.qte && G.qte.kind === 'timing') { qteTap(x, y); return; }
  if (G.qte && G.qte.kind === 'mash') { mashTap(); return; }
  if (P.mode === 'twin') { swipe = { x, y, done: false, twin: x < W / 2 ? 0 : 1 }; return; }
  swipe = { x, y, done: false };
});
cv.addEventListener('pointermove', e => {
  if (!swipe || swipe.done) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y, th = 26;
  if (Math.abs(dx) > th || Math.abs(dy) > th) {
    swipe.done = true;
    if (swipe.twin !== undefined) { if (Math.abs(dy) >= Math.abs(dx)) (dy < 0 ? twinJump : twinDuck)(swipe.twin); else twinJump(swipe.twin); return; }
    if (Math.abs(dx) > Math.abs(dy)) act(dx < 0 ? 'left' : 'right'); else act(dy < 0 ? 'jump' : 'duck');
  }
});
window.addEventListener('pointerup', () => { if (swipe && !swipe.done && swipe.twin !== undefined) twinJump(swipe.twin); swipe = null; });
document.querySelectorAll('#ctl .cb').forEach(b => b.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  if (G.qte && G.qte.kind === 'mash') { mashTap(); return; }
  if (G.qte && G.qte.manual) { const it = G.qte.items.find(i => !i.j); if (it) qteTap(it.x * W, it.y * H); return; }
  act(b.dataset.act);
}));
document.querySelectorAll('#twinCtl .cb').forEach(b => b.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  if (G.hint && (G.hint.need === 'tap' || G.hint.need === 'msg')) { resolveHint(); return; }
  if (G.qte && G.qte.kind === 'mash') { mashTap(); return; }
  (b.dataset.a === 'duck' ? twinDuck : twinJump)(+b.dataset.twin);
}));
window.addEventListener('keydown', e => {
  if (G.scene !== 'play') return;
  const k = e.key;
  const map = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowUp: 'jump', w: 'jump', ' ': 'jump', ArrowDown: 'duck', s: 'duck' };
  if (k === 'Escape' || k === 'p') { togglePause(true); return; }
  if (G.hint && (G.hint.need === 'tap' || G.hint.need === 'msg') && (k === ' ' || k === 'Enter')) { resolveHint(); e.preventDefault(); return; }
  if (G.qte && G.qte.kind === 'timing' && (k === ' ' || k === 'Enter')) { const it = G.qte.items.find(i => !i.j); if (it) qteTap(it.x * W, it.y * H); e.preventDefault(); return; }
  if (G.qte && G.qte.kind === 'mash' && map[k]) { mashTap(); e.preventDefault(); return; }
  if (map[k]) { act(map[k]); e.preventDefault(); }
});

// ============================================================ hints
function activateHint(h) {
  if (h.intro && save.seen && save.seen[h.intro]) { h.done = true; return; }
  if ((h.need === 'left' || h.need === 'right') && h.obsLane !== undefined && P.lane !== h.obsLane) { h.done = true; return; }
  if (h.need === 'lane' && P.lane === h.lane) { h.done = true; popText('좋아요!', '#fff', 0.32, 0.8, 30); return; }
  if (h.need === 'msg') { h.done = true; popText(h.text, '#fff', 0.3, 2, 28); return; }
  G.hint = h;
  const el = document.getElementById('hint');
  document.getElementById('hintIcon').textContent = h.icon || '';
  document.getElementById('hintText').textContent = h.text;
  document.getElementById('hintOk').hidden = h.need !== 'tap';
  el.hidden = false;
  const btn = { left: 'left', right: 'right', jump: 'jump', duck: 'duck', lane: h.lane < 0 ? 'left' : 'right' }[h.need];
  document.querySelectorAll('#ctl .cb').forEach(b => b.classList.toggle('pulse', b.dataset.act === btn));
}
function resolveHint() {
  if (!G.hint) return;
  if (G.hint.intro) { save.seen = save.seen || {}; save.seen[G.hint.intro] = true; persist(); }
  G.hint.done = true; G.hint = null;
  document.getElementById('hint').hidden = true;
  document.querySelectorAll('#ctl .cb').forEach(b => b.classList.remove('pulse'));
  SFX.ui();
}
document.getElementById('hintOk').addEventListener('click', () => resolveHint());

// ============================================================ QTE: timing tricks
const SYMS = [['★', '#ff5c8a'], ['●', '#2f8cff'], ['▲', '#22b866'], ['◆', '#ff8a00'], ['♥', '#e8262b'], ['✚', '#8b3fc6']];
function startTrick(r) {
  const df = DIFF[save.diff];
  const app = df.approach, gap = Math.max(0.55, 0.85 * df.approach);
  const items = [];
  const t0 = G.rt + 0.35;
  let px = 0.5;
  for (let i = 0; i < r.count; i++) {
    let x, side = -1;
    if (r.twin) { side = i % 2; x = side ? 0.6 + Math.random() * 0.24 : 0.16 + Math.random() * 0.24; }
    else { do { x = 0.2 + Math.random() * 0.6; } while (Math.abs(x - px) < 0.22); }
    px = x;
    const [sym, col] = r.twin ? ['7', side ? '#2f8cff' : '#8b3fc6'] : SYMS[(i + r.count) % SYMS.length];
    items.push({ t: t0 + app + i * gap, x, y: 0.2 + Math.random() * 0.22 + 0.04, sym, col, j: null, side });
  }
  const pipe = r.kind === 'pipe';
  G.qte = { kind: 'timing', items, app, t0: G.rt, end: items[items.length - 1].t + 0.5, trickIdx: 0, twin: !!r.twin, pipe, y0: r.top || 0.7, hmax: pipe ? 2.6 : 2.0, anims: [null, null] };
  P.mode = 'trick'; P.air = true; P.duck = 0; P.push = 0;
  SFX.jump();
  if (r.twin) { SFX.split(); popText('14 = 7 + 7', '#fff', 0.62, 1.1, 36, '더블 점프!'); const p = playerScreen(); burst(p[0], p[1], 24, RAINBOW, 280, 6); }
  else popText(pipe ? '하프파이프!' : '날아올라!', '#fff', 0.62, 0.8, 30);
}
function startManual(m) {
  const items = [], t0 = G.rt + 0.25;
  for (let i = 0; i < m.count; i++) items.push({ t: t0 + m.app + i * m.beat, x: 0.5, y: 0.3, sym: '♪', col: i % 2 ? '#22b866' : '#ff8a00', j: null, side: -1 });
  G.qte = { kind: 'timing', manual: true, items, app: m.app, t0: G.rt, end: items[items.length - 1].t + 0.45, trickIdx: 0, anims: [null, null] };
  P.mode = 'manual'; P.manual = 1; P.duck = 0; P.push = 0; P.anim = null;
  popText('매뉴얼!', '#fff', 0.62, 0.9, 30, '박자에 맞춰 톡!');
}

function judgeWin() { const w = DIFF[save.diff].win; return { P: 0.065 * w, G: 0.13 * w, N: 0.22 * w }; }
function qteTap(x, y) {
  const q = G.qte; if (!q) return;
  const R = Math.min(W, H) * 0.085;
  let best = null, bd = 1e9;
  for (const it of q.items) {
    if (it.j) continue;
    const dt = it.t - G.rt; if (dt > q.app) continue;
    const d = Math.hypot(x - it.x * W, y - it.y * H);
    const score = Math.abs(dt) + d * 0.0005;
    if (d < R * 1.7 && score < bd) { bd = score; best = it; }
  }
  if (!best) return;
  const off = Math.abs(G.rt - best.t), w = judgeWin();
  const k = off <= w.P ? 'P' : off <= w.G ? 'G' : off <= w.N ? 'N' : 'B';
  applyJudge(best, k);
}

const JUDGE_TXT = { P: ['퍼펙트!', 'PERFECT', '#ffb300'], G: ['그레이트!', 'GREAT', '#22b866'], N: ['노멀', 'NORMAL', '#2f8cff'], B: ['배드', 'BAD', '#8d90a6'] };
function applyJudge(it, k) {
  it.j = k; G.run[k]++;
  const bonus = { P: 3, G: 2, N: 1, B: 0 }[k]; G.run.bonus += bonus;
  SFX.judge(k);
  const [t1, t2, col] = JUDGE_TXT[k];
  const q = G.qte;
  if (k !== 'B') {
    const list = q.manual ? MANUAL_TRICKS : q.pipe ? PIPE_TRICKS : TRICKS;
    const tr = list[q.trickIdx++ % list.length];
    const anim = { type: tr[0], t0: G.rt, dur: q.pipe ? 0.62 : 0.5 };
    if (q.manual) P.manual = tr[0] === 'nose' ? -1 : 1;
    else if (q.twin) q.anims[it.side] = anim;
    else P.anim = anim;
    const who = q.twin ? (it.side ? '오른쪽 7 ' : '왼쪽 7 ') : '';
    popText(t1, col, 0.5, 0.8, k === 'P' ? 46 : 38, `${t2} · ${who}${tr[1]}${bonus ? '  +' + bonus : ''}`);
    burst(it.x * W, it.y * H, k === 'P' ? 26 : 14, k === 'P' ? RAINBOW : [col, '#fff'], 260, 7);
    cheerNearby();
  } else {
    P.wob = 0.6;
    popText(t1, col, 0.5, 0.7, 34, t2);
  }
}

function updateTiming() {
  const q = G.qte, w = judgeWin();
  for (const it of q.items) if (!it.j && G.rt > it.t + w.N + 0.08) { applyJudge(it, 'B'); }
  const u = clamp((G.rt - q.t0) / (q.end - q.t0), 0, 1);
  const good = q.items.filter(i => i.j && i.j !== 'B').length;
  if (q.manual) {
    if (u >= 1) { G.qte = null; P.mode = 'ride'; P.manual = 0; SFX.land(); popText(good === q.items.length ? '완벽한 균형!' : '매뉴얼 끝!', '#fff', 0.42, 1, 30); }
    return;
  }
  P.y = q.y0 * (1 - u) + q.hmax * 4 * u * (1 - u);
  if (u >= 1) {
    G.qte = null; P.mode = 'ride'; P.air = false; P.y = 0; P.vy = 0;
    SFX.land(); G.shake = 0.25;
    const pp = P3(P.x, 0, P.z); burst(pp[0], pp[1], 14, ['#ffffff', '#e0d6c0'], 160, 6, 300);
    if (q.twin) { SFX.merge(); popText('7 + 7 = 14!', '#fff', 0.3, 1.3, 42, '다시 합체!'); const p = playerScreen(); burst(p[0], p[1], 26, RAINBOW, 300, 7); }
    else if (good === 0) { popText('휘청~ 괜찮아요!', '#fff', 0.42, 1, 28); P.wob = 0.8; }
    else if (good === q.items.length) popText('멋진 착지!', '#fff', 0.42, 1, 30);
  }
}

// ============================================================ QTE: mash (grind)
function startGrind(r) {
  const df = DIFF[save.diff];
  const dur = r.len / G.lv.speed;
  G.qte = { kind: 'mash', t0: G.rt, dur, taps: 0, target: Math.max(4, Math.round(dur * df.rate)), rail: r, last: 0 };
  P.mode = 'grind'; P.air = false; P.y = 0.5; P.x = r.lane; P.duck = 0;
  SFX.jump(); popText(r.slide ? '보드슬라이드! 연타!' : '그라인드! 연타!', '#ffe14d', 0.62, 0.9, 32);
}
function mashTap() {
  const q = G.qte; if (!q || q.kind !== 'mash') return;
  q.taps++; q.last = G.rt; SFX.tap();
  const xs = q.twin && G.twin ? G.twin.tw.map(t => t.x) : [P.x];
  for (const x of xs) { const p = P3(x, 0.5, P.z); burst(p[0], p[1], 6, ['#ffe14d', '#ff8a00', '#ffffff'], 220, 4, 600); }
}

function endGrind() {
  const q = G.qte; G.qte = null;
  const ratio = q.taps / q.target;
  const k = ratio >= 1 ? 'P' : ratio >= 0.75 ? 'G' : ratio >= 0.45 ? 'N' : 'B';
  G.run[k]++;
  const bonus = { P: 6, G: 4, N: 2, B: 0 }[k]; G.run.bonus += bonus;
  SFX.judge(k);
  const [t1, t2, col] = JUDGE_TXT[k];
  const name = q.twin ? '더블 그라인드' : q.rail.slide ? '보드슬라이드' : '그라인드';
  popText(t1, col, 0.45, 1, 42, `${t2} · ${name} ${q.taps}번${bonus ? '  +' + bonus : ''}`);
  if (k !== 'B') cheerNearby();
  if (q.twin && G.twin) { G.twin.grind = false; for (const t of G.twin.tw) { t.air = true; t.vy = 3.2; } return; }
  P.mode = 'ride'; P.air = true; P.vy = 4.5; P.y = 0.5; P.anim = k === 'B' ? null : { type: 'kickflip', t0: G.rt, dur: 0.45 };
}

// ============================================================ twins (14 → 7 + 7)
function startTwin(f) {
  G.twin = { f, phase: 'split', t0: G.rt, grind: false, tw: [{ x: P.x, y: 0, vy: 0, air: false, duck: 0 }, { x: P.x, y: 0, vy: 0, air: false, duck: 0 }] };
  P.mode = 'twin'; P.air = false; P.y = 0; P.duck = 0;
  SFX.split();
  popText('14 = 7 + 7', '#fff', 0.3, 1.4, 44, '둘로 나뉘었어요!');
  const p = playerScreen(); burst(p[0], p[1], 30, RAINBOW, 300, 7);
  setControls('twin');
}
function twinJump(i) {
  const T = G.twin; if (!T || T.phase !== 'run' || T.grind) return;
  const t = T.tw[i]; if (t.air) { t.jbuf = G.rt; return; }
  t.air = true; t.vy = JUMPV; t.duck = 0; SFX.jump();
}
function twinDuck(i) {
  const T = G.twin; if (!T || T.phase !== 'run' || T.grind) return;
  const t = T.tw[i]; t.duck = DUCK_T; if (t.air) t.vy = Math.min(t.vy, -12); SFX.duck();
}
function startTwinGrind(r) {
  const df = DIFF[save.diff], dur = r.len / G.lv.speed;
  G.qte = { kind: 'mash', t0: G.rt, dur, taps: 0, target: Math.max(4, Math.round(dur * df.rate)), rail: r, last: 0, twin: true };
  G.twin.grind = true;
  for (const t of G.twin.tw) { t.air = false; t.vy = 0; t.y = 0.5; t.duck = 0; }
  SFX.jump(); popText('더블 그라인드! 연타!', '#ffe14d', 0.62, 0.9, 30);
}

function endTwin() {
  const T = G.twin; T.phase = 'merge'; T.t0 = G.rt;
  SFX.merge();

  }

  for (const r of lv.ramps) if (r.z + r.len > zMin && r.z < zMax) spr.push({ z: r.z + r.len, draw: () => drawRamp(r) });
  for (const r of lv.rails) if (r.z + r.len > zMin && r.z < zMax) spr.push({ z: r.z > P.z ? r.z : P.z + 0.02, draw: () => drawRail(r), noFade: true });
  for (const f of lv.forks) if (f.z + f.len > zMin && f.z < zMax) spr.push({ z: f.z + f.len, draw: () => drawIsland(f, th) });
  for (const m of lv.manuals) if (m.z + m.len > zMin && m.z < zMax) spr.push({ z: m.z + m.len, draw: () => drawManual(m), noFade: true });

function armPose() {
  if (P.mode === 'finish' && P.front) { const w = Math.sin(G.rt * 10) * 0.4; return [-2.3 + w, 2.3 - w]; }
  if (P.mode === 'crash') return [-2.6, 2.6];
  if (P.duck > 0) return [-1.3, 1.3];
  if (P.mode === 'trick' || P.air) return [-2.4 + Math.sin(G.rt * 8) * 0.2, 2.4 - Math.sin(G.rt * 8) * 0.2];
  if (P.mode === 'grind') return [-1.6 + Math.sin(G.rt * 11) * 0.3, 1.6 + Math.sin(G.rt * 11 + 1) * 0.3];
  if (P.mode === 'manual') return [-1.9 + Math.sin(G.rt * 6) * 0.25, 1.9 + Math.sin(G.rt * 6 + 2) * 0.25];
  if (P.push > 0) return [-0.9, 0.5 + P.push * 0.5];
  const sway = Math.sin(G.rt * 4) * 0.12;
  return [-0.75 - P.lean * 0.8 + sway, 0.75 - P.lean * 0.8 + sway];
}

// skateboard in real perspective: rotY = shuvit/spin, flip = kickflip (roll about the long axis)
function drawBoard3D(x, y, z, bd, rotY, flip, scale, pitch = 0, bflip = 0) {
  const hw = 0.17 * scale, hl = 0.46 * scale, yb = y + 0.07;
  const cy = Math.cos(rotY), sy = Math.sin(rotY), cf = Math.cos(flip), sf = Math.sin(flip);
  const cb = Math.cos(bflip), sb = Math.sin(bflip), sp = Math.sin(Math.abs(pitch));
  const T = (bx, bz, by = 0) => {
    // flip around long axis (z), backflip around side axis, wheelie pitch, then rotate around vertical
    let fx = bx * cf - by * sf, fy = bx * sf + by * cf, fz = bz;
    if (bflip) { const ny = fy * cb - bz * sb, nz = fy * sb + bz * cb; fy = ny; fz = nz; }
    if (pitch) fy += (pitch > 0 ? bz + hl : hl - bz) * sp;
    const rx = fx * cy + fz * sy, rz = -fx * sy + fz * cy;
    return P3(x + rx, yb + fy + (Math.abs(bz) > hl * 0.78 ? 0.035 * scale : 0), z + rz);
  };
  const topUp = cf * cb > 0;
  // wheels
  if (topUp && Math.abs(flip) < 0.01 && !bflip) for (const wz of [-0.3, 0.3]) for (const wx of [-0.13, 0.13]) { const p = T(wx * scale, wz * scale, -0.055 * scale); circ(p[0], p[1], 0.045 * scale * p[2], '#2b2b40'); circ(p[0], p[1], 0.022 * scale * p[2], '#ffd200'); }
  const bands = bd.cols.length;
  for (let i = 0; i < bands; i++) {
    const z0 = -hl + (2 * hl) * i / bands, z1 = -hl + (2 * hl) * (i + 1) / bands;
    const w0 = hw * (Math.abs(z0) > hl * 0.8 ? 0.8 : 1), w1 = hw * (Math.abs(z1) > hl * 0.8 ? 0.8 : 1);
    poly([T(-w0, z0), T(w0, z0), T(w1, z1), T(-w1, z1)], topUp ? bd.cols[i] : (i % 2 ? bd.under : shade(bd.under, 0.15)));
  }
  if (bd.glow && topUp) { const p = T(0, 0); ctx.fillStyle = 'rgba(120,255,200,.18)'; ctx.beginPath(); ctx.ellipse(p[0], p[1], hw * 3 * p[2], hw * 1.2 * p[2], 0, 0, 7); ctx.fill(); }
  if (bd.sparkle && Math.random() < 0.3) { const p = T((Math.random() - 0.5) * hw * 2, (Math.random() - 0.5) * hl * 2); circ(p[0], p[1], 0.015 * p[2], '#fff'); }
}

// ============================================================ render: overlay (QTE, texts, particles)
function drawOverlay() {
  const q = G.qte;
  if (q && q.kind === 'timing') {
    const R = Math.min(W, H) * 0.085;
    const firstOpen = q.manual ? q.items.find(i => !i.j) : null;
    for (const it of q.items) {
      if (q.manual && !it.j && it !== firstOpen) continue;
      const dt = it.t - G.rt;
      if (it.j) { const age = G.rt - (it.jt || (it.jt = G.rt)); if (age > 0.35) continue; ctx.globalAlpha = 1 - age / 0.35; circ(it.x * W, it.y * H, R * (1 + age * 1.5), it.j === 'B' ? 'rgba(140,140,160,.5)' : 'rgba(255,255,255,.6)'); ctx.globalAlpha = 1; continue; }
      if (dt > q.app) continue;
      const u = 1 - dt / q.app, x = it.x * W, y = it.y * H;
      ctx.globalAlpha = clamp(u * 3, 0, 1);
      circ(x, y + 5, R, 'rgba(0,0,0,.18)'); circ(x, y, R, it.col); circ(x, y, R * 0.8, shade(it.col, 0.25));
      ctx.fillStyle = '#fff'; ctx.font = `${R * 0.95}px Jua, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(it.sym, x, y + R * 0.05);
      const rr = R * (1 + 1.5 * Math.max(0, dt / q.app));
      ctx.strokeStyle = Math.abs(dt) < 0.08 ? '#ffe14d' : '#ffffff'; ctx.lineWidth = Math.max(4, R * 0.12);
      ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  if (q && q.kind === 'mash') {
    const u = clamp((G.rt - q.t0) / q.dur, 0, 1), fill = clamp(q.taps / q.target, 0, 1);
    const x = W / 2, y = H * 0.36, R = Math.min(W, H) * 0.13, pul = 1 + (G.rt - q.last < 0.1 ? 0.08 : Math.sin(G.rt * 14) * 0.03);
    circ(x, y + 6, R * pul, 'rgba(0,0,0,.18)'); circ(x, y, R * pul, '#ff8a00'); circ(x, y, R * 0.82 * pul, '#ffb04d');
    ctx.fillStyle = '#fff'; ctx.font = `${R * 0.42}px Jua, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('연타!', x, y - R * 0.08); ctx.font = `${R * 0.24}px Jua, sans-serif`; ctx.fillText(`${q.taps} / ${q.target}`, x, y + R * 0.3);
    ctx.lineWidth = R * 0.14; ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(x, y, R * 1.18, 0, 7); ctx.stroke();
    ctx.strokeStyle = fill >= 1 ? '#ffe14d' : '#22b866'; ctx.beginPath(); ctx.arc(x, y, R * 1.18, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * fill); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(W * 0.2, y + R * 1.5, W * 0.6, 6); ctx.fillStyle = '#ff5c8a'; ctx.fillRect(W * 0.2, y + R * 1.5, W * 0.6 * (1 - u), 6);
  }
  if (G.twin && G.twin.phase === 'run') {
    ctx.font = `${Math.min(W, H) * 0.045}px Jua, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 4;
    ctx.strokeText('왼쪽 7        오른쪽 7', W / 2, H * 0.17); ctx.fillText('왼쪽 7        오른쪽 7', W / 2, H * 0.17);
  }
  // countdown
  if (G.scene === 'play' && G.lv && G.rt - G.startT < 1.2) {
    const t = G.rt - G.startT, s = t < 0.8 ? '준비~' : '출발!';
    ctx.font = `${Math.min(W, H) * 0.12}px Jua, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.fillStyle = t < 0.8 ? '#ffffff' : '#ffe14d';
    ctx.strokeText(s, W / 2, H * 0.45); ctx.fillText(s, W / 2, H * 0.45);
  }
  // particles
  for (const p of G.parts) {
    const a = 1 - p.t / p.life; ctx.globalAlpha = clamp(a * 1.5, 0, 1);

    ctx.font = `${size}px Jua, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = size * 0.16; ctx.strokeStyle = 'rgba(40,30,60,.55)'; ctx.lineJoin = 'round'; ctx.strokeText(t.txt, 0, 0);
    ctx.fillStyle = t.color; ctx.fillText(t.txt, 0, 0);

  }

      btn.disabled = n > save.unlocked;
      btn.innerHTML = `${n > save.unlocked ? '🔒' : n}<span class="s">${n > save.unlocked ? '' : '★'.repeat(st)}</span>`;
      btn.setAttribute('aria-label', `스테이지 ${n}`);
      btn.onclick = () => { SFX.ui(); startStage(n); };
      g.appendChild(btn);
    }
    z.appendChild(g); box.appendChild(z);
  }
  setTimeout(() => { const c = box.querySelector('.cur'); if (c) c.scrollIntoView({ block: 'center' }); }, 30);
}

let shopTab = 'sticker';
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { shopTab = t.dataset.tab; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t)); SFX.ui(); renderShop(); });
function renderShop() {
  const box = $('items'); box.innerHTML = '';
  document.querySelectorAll('.coinOut').forEach(e => e.textContent = save.coins);
  let list;
  if (shopTab === 'sticker') list = STICKER_NUMS.map(n => ({ key: 'sticker:' + n, name: `${n} 스티커`, price: stickerPrice(n), n }));
  else if (shopTab === 'skin') list = SKINS.map(s => ({ key: 'skin:' + s.id, name: s.name, price: s.price, skin: s }));
  else list = BOARDS.map(b => ({ key: 'board:' + b.id, name: b.name, price: b.price, board: b }));
  for (const it of list) {
    const d = document.createElement('div'); d.className = 'item';
    const owned = save.owned.includes(it.key);
    let prev;
    if (it.n) { prev = document.createElement('img'); prev.src = IMG_SRC[it.n]; prev.alt = it.name; }
    else { prev = document.createElement('canvas'); prev.width = 240; prev.height = 220; drawPreview(prev, it); }
    d.appendChild(prev);
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = it.name; d.appendChild(nm);
    const b = document.createElement('button');
    const equipped = (it.n && save.sticker === it.n) || (it.skin && save.skin === it.skin.id) || (it.board && save.board === it.board.id);
    if (!owned) {
      b.innerHTML = `<i class="ci"></i> ${it.price}`;
      if (save.coins < it.price) { b.disabled = true; b.innerHTML = `<i class="ci"></i> ${it.price} (부족)`; }
      b.onclick = () => {
        if (save.coins < it.price) return;
        save.coins -= it.price; save.owned.push(it.key); equip(it); persist(); SFX.buy(); toast(`${it.name}을(를) 샀어요!`); renderShop();
      };
    } else if (equipped) {
      b.className = 'eq'; b.textContent = it.n ? '붙임 (떼기)' : '사용 중';
      b.onclick = () => { if (it.n) { save.sticker = 0; persist(); SFX.ui(); renderShop(); } };
    } else {
      b.className = 'own'; b.textContent = it.n ? '붙이기' : '사용하기';
      b.onclick = () => { equip(it); persist(); SFX.ui(); renderShop(); };
    }
    d.appendChild(b); box.appendChild(d);
  }
  const tip = document.createElement('p'); tip.className = 'note'; tip.style.gridColumn = '1/-1'; tip.style.color = '#fff'; tip.style.textShadow = '0 2px 0 rgba(0,0,0,.3)';
  tip.textContent = shopTab === 'sticker' ? '스티커는 14의 등에 붙어요. 스케이트 탈 때 보여요!' : '깬 스테이지를 다시 하면 코인을 더 모을 수 있어요.';
  box.appendChild(tip);
}
function equip(it) { if (it.n) save.sticker = it.n; if (it.skin) save.skin = it.skin.id; if (it.board) save.board = it.board.id; }
function drawPreview(c, it) {
  const g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  if (it.skin) {
    // draw front-facing 14 with that skin
    g.save(); g.translate(120, 205); g.scale(150, 150);
    withCtx(g, () => draw14(it.skin, true, [-0.8, 0.8]));
    g.restore();
  } else {
    const bd = it.board, L = 200, Wd = 64, x = 20, y = 70;
    g.save(); g.translate(120, 110); g.rotate(-0.25); g.translate(-120, -110);
    g.fillStyle = '#2b2b40'; for (const wx of [x + 34, x + L - 46]) { g.fillRect(wx, y - 8, 14, 10); g.fillRect(wx, y + Wd - 2, 14, 10); }
    g.beginPath(); g.moveTo(x + 30, y); g.lineTo(x + L - 30, y); g.arc(x + L - 30, y + Wd / 2, Wd / 2, -Math.PI / 2, Math.PI / 2); g.lineTo(x + 30, y + Wd); g.arc(x + 30, y + Wd / 2, Wd / 2, Math.PI / 2, -Math.PI / 2); g.closePath(); g.save(); g.clip();
    bd.cols.forEach((col, i) => { g.fillStyle = col; g.fillRect(x + i * L / bd.cols.length, y, L / bd.cols.length + 1, Wd); });
    if (bd.sparkle) for (let i = 0; i < 12; i++) { g.fillStyle = '#fff'; g.beginPath(); g.arc(x + hash(i * 5) * L, y + hash(i * 9) * Wd, 2, 0, 7); g.fill(); }
    g.restore(); g.lineWidth = 3; g.strokeStyle = 'rgba(0,0,0,.15)'; g.stroke();
    g.restore();
  }
}
function withCtx(g, fn) { const saved = ctx; ctx = g; try { fn(); } finally { ctx = saved; } }

function renderSettings() {
  const seg = $('segDiff'); seg.innerHTML = '';
  for (const k of ['easy', 'normal', 'hard']) {
    const b = document.createElement('button'); b.textContent = DIFF[k].name; b.classList.toggle('on', save.diff === k);
    b.onclick = () => { save.diff = k; persist(); SFX.ui(); renderSettings(); };
    seg.appendChild(b);
  }
  $('diffNote').textContent = DIFF[save.diff].note + ' 언제든 바꿀 수 있어요.';
  document.querySelectorAll('#segSound button').forEach(b => { b.classList.toggle('on', (b.dataset.v === '1') === save.sound); b.onclick = () => { setSound(b.dataset.v === '1'); audioInit(); SFX.ui(); renderSettings(); }; });
  $('btnReset').textContent = resetArm ? '정말 지울까요? 한 번 더 누르면 지워져요' : '처음부터 다시 하기';
  $('resetNote').textContent = resetArm ? '스테이지 기록, 코인, 산 물건이 모두 지워져요.' : '';
}
let resetArm = false;
$('btnReset').onclick = () => {
  if (!resetArm) { resetArm = true; renderSettings(); setTimeout(() => { resetArm = false; if (!$('settings').hidden) renderSettings(); }, 4000); return; }
  resetArm = false; const keepDiff = save.diff, keepSound = save.sound; save = DEFAULT_SAVE(); save.diff = keepDiff; save.sound = keepSound; persist(); toast('처음부터 시작해요!'); renderSettings();
};

function showResult(win) {
  const lv = G.lv, n = lv.n, r = G.run;
  G.result = { win };
  setPlaying(false); updateLoops(false, false, 0);
  let stars = 0, clearBonus = 0;
  if (win) {
    stars = r.hits === 0 ? 3 : r.hits === 1 ? 2 : 1;
    if (lv.tutorial) stars = 3;
    clearBonus = 10 + stars * 5;
    save.stars[n] = Math.max(save.stars[n] || 0, stars);
    if (n >= save.unlocked) save.unlocked = Math.min(100, n + 1);
    if (n === 100) save.allClear = true;
  }
  const earned = r.coins + r.bonus + clearBonus;
  save.coins += earned; persist();
  const panel = $('resPanel');
  const judges = `<div class="judges"><div class="jp">퍼펙트<b>${r.P}</b></div><div class="jg">그레이트<b>${r.G}</b></div><div class="jn">노멀<b>${r.N}</b></div><div class="jb">배드<b>${r.B}</b></div></div>`;
  if (win) {
    panel.innerHTML = `<h2>${n === 100 ? '100 스테이지 모두 클리어!' : '스테이지 ' + n + ' 클리어!'}</h2>
      <div class="stars">${'<b>★</b>'.repeat(stars)}${'★'.repeat(3 - stars)}</div>
      <div class="earn"><i class="ci"></i> +${earned} <small>(코인 ${r.coins} · 기술 ${r.bonus} · 클리어 ${clearBonus})</small></div>
      ${judges}
      <p class="note">${stars < 3 ? '한 번도 안 부딪히면 별 3개!' : '완벽해요! 친구들이 박수 쳐줘요 👏'}</p>
      <div class="col" style="margin:12px auto 0">
        ${n < 100 ? '<button class="btn go" id="rNext">다음 스테이지 ▶</button>' : ''}
        <button class="btn warm" id="rAgain">한 번 더 (코인 모으기)</button>
        <button class="btn grey" id="rMap">스테이지 지도</button>
      </div>`;
  } else {
    panel.innerHTML = `<h2>아쉬워요!</h2>
      <p class="note" style="font-size:18px">하트를 다 썼어요. 다시 해볼까요?</p>
      <div class="earn"><i class="ci"></i> +${earned} <small>모은 코인은 저장했어요</small></div>
      ${judges}
      <p class="note">설정에서 난이도를 '쉬움'으로 바꾸면 하트가 5개예요.</p>
      <div class="col" style="margin:12px auto 0">
        <button class="btn go" id="rAgain">다시 하기</button>
        <button class="btn grey" id="rMap">스테이지 지도</button>
      </div>`;
  }
  showScreen('result');
  const nx = $('rNext'); if (nx) nx.onclick = () => { G.result = null; startStage(n + 1); };
  $('rAgain').onclick = () => { G.result = null; startStage(n); };
  $('rMap').onclick = () => { G.result = null; goMap(); };
}

// ============================================================ main loop
let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
  G.rt += rdt;
  try { update(rdt); render(); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
goMenu();
requestAnimationFrame(frame);
</script>

</body>
</html>
